    function handleTimetableDrop(e, day, period) {
      e.preventDefault(); e.currentTarget.classList.remove('dragover');
      let dataStr = e.dataTransfer.getData('application/json'); if (!dataStr) return;
      let item = JSON.parse(dataStr);
      let isMove = (item.source === 'timetable');

      if (!isMove && currentScheduleView !== 'class') {
          return alert("❌ 新增課程請先切換至「班級課表」視圖。\n(若要交換/移動已排好的課，則可於任何視圖拖曳)");
      }

      let targetClassId = isMove ? item.classId : currentScheduleTarget;
      if (!targetClassId) return alert("請先選擇檢視對象！");

      if (isMove && item.oldDay === day && item.oldPeriod === period) return; 

      let incomingSubName = item.subName || ""; 
      let incomingTeaRole = (globalScheduleData.teachers.find(t=>t.id===item.teaId)?.role || "");
      let isIncomingResource = incomingSubName.includes("資源") || incomingSubName.includes("特教") || incomingTeaRole.includes("特教") || incomingTeaRole.includes("教支");
      let isIncomingHomeroom = (item.teaId === globalScheduleData.classes.find(c=>c.id===targetClassId)?.homeroomId && item.teaId !== "");
      let isIncomingLocal = incomingSubName.includes("本土") || incomingSubName.includes("閩") || incomingSubName.includes("客");
      let lType = incomingSubName.includes("單週") ? "ODD" : (incomingSubName.includes("雙週") ? "EVEN" : "FULL");

      if (period === "M" && !isIncomingResource) {
          if (!confirm("⚠️ 操作警告：晨間/早會時段通常僅開放「資源班」。\n您確定要強制排入嗎？")) return;
      }

      let slotOccupants = globalScheduleData.timetable.filter(t => t.day === day && t.period === period);
      
      let targetItem = null;
      if (isMove) {
         let viewOccupants = slotOccupants.filter(t => {
             if (currentScheduleView === 'class') return t.classId === currentScheduleTarget;
             if (currentScheduleView === 'teacher') return t.teaId === currentScheduleTarget;
             if (currentScheduleView === 'room') return getRoomIdForLesson(t.classId, t.subId, t.subName, t.roomId) === currentScheduleTarget;
             if (currentScheduleView === 'resource') return t.subName === currentScheduleTarget;
         });
         if (viewOccupants.length > 0) targetItem = viewOccupants[0]; 
      }

      // ⭐ 鎖定保護：目標時段若有鎖定(預排)課程，不允許交換/覆蓋
      if (targetItem && isLockedRecord(targetItem)) {
          return alert("🔒 目標時段有已鎖定的預排課程，無法交換或覆蓋。");
      }

      let hasConflict = false;
      let conflictMsgs = [];

      let lessonTeachers = [item.teaId];
      if (incomingSubName.includes("外師") || item.isCoTeach) {
          let hrId = globalScheduleData.classes.find(c=>c.id === targetClassId)?.homeroomId;
          if (hrId) lessonTeachers.push(hrId);
      }

      let manualRoomId = document.getElementById('manualRoomSelect') ? document.getElementById('manualRoomSelect').value : "";
      let expectedRoomId = item.roomId || ""; 
      if (manualRoomId === "CLEAR") expectedRoomId = "";
      else if (manualRoomId) expectedRoomId = manualRoomId;

      slotOccupants.forEach(ex => {
          if (targetItem && ex.classId === targetItem.classId && ex.subId === targetItem.subId && ex.teaId === targetItem.teaId) return;

          if (ex.classId === targetClassId) { 
              let eType = ex.subName.includes("單週") ? "ODD" : (ex.subName.includes("雙週") ? "EVEN" : "FULL");
              let exRole = (globalScheduleData.teachers.find(t=>t.id===ex.teaId)?.role || "");
              let isExSpecial = ex.subName.includes("資源") || ex.subName.includes("特教") || exRole.includes("特教") || exRole.includes("教支");
              let isExHomeroom = (ex.teaId === globalScheduleData.classes.find(c=>c.id===ex.classId)?.homeroomId && ex.teaId !== "");
              let isExLocal = ex.subName.includes("本土") || ex.subName.includes("閩") || ex.subName.includes("客");

              if ((eType === "ODD" && lType === "EVEN") || (eType === "EVEN" && lType === "ODD")) {
              } else if ((isExSpecial && isIncomingHomeroom) || (isIncomingResource && isExHomeroom)) {
                  return; // ⭐ 資源班+導師可共存 → 跳過此佔用者的所有後續檢查（含教師衝堂）
              } else if (isExLocal && isIncomingLocal) {
              } else {
                  hasConflict = true; conflictMsgs.push(`該班(${ex.subName})已滿`); 
              }
          }
          
          let exTeachers = [ex.teaId];
          if (ex.subName.includes("外師") || ex.isCoTeach) {
              let exHrId = globalScheduleData.classes.find(c=>c.id === ex.classId)?.homeroomId;
              if (exHrId) exTeachers.push(exHrId);
          }
          
          for (let t of lessonTeachers) {
              if (t !== "" && exTeachers.includes(t)) {
                  let eType = ex.subName.includes("單週") ? "ODD" : (ex.subName.includes("雙週") ? "EVEN" : "FULL");
                  if (eType === "FULL" || lType === "FULL" || eType === lType) {
                      hasConflict = true; conflictMsgs.push(`教師(${globalScheduleData.teachers.find(tea=>tea.id===t)?.name || t})在同時間已有課`);
                  }
              }
          }
      });

      let lessonRoomId = getRoomIdForLesson(targetClassId, item.subId, incomingSubName, expectedRoomId);
      if (lessonRoomId && lessonRoomId !== "ROOM_HOME") {
          let roomBusy = slotOccupants.some(ex => {
              if (targetItem && ex.classId === targetItem.classId && ex.subId === targetItem.subId && ex.teaId === targetItem.teaId) return false;
              return getRoomIdForLesson(ex.classId, ex.subId, ex.subName, ex.roomId) === lessonRoomId;
          });
          let rName = globalScheduleData.rooms.find(r=>r.id===lessonRoomId)?.name || lessonRoomId;
          if (roomBusy) { hasConflict = true; conflictMsgs.push(`專科教室(${rName})被借用`); }
      }

      let subjectTimeRules = globalScheduleData.rules.filter(r => r.dim === "特定時段科目限制");
      let cls = globalScheduleData.classes.find(c=>c.id===targetClassId);
      let lessonGrade = cls ? (cls.name.match(/\d+/) ? cls.name.match(/\d+/)[0] : "0") : "0";
      
      for (let r of subjectTimeRules) {
          if (r.type === "年級" && r.code.split(',').includes(lessonGrade)) {
              let params = Object.fromEntries(r.param.split(';').map(p => p.split(':')));
              let ruleDay = params['星期'];
              let rulePeriods = params['節次'] ? params['節次'].split(',') : [];
              let ruleSubj = params['科目'];
              let ruleConstraint = params['限制'];

              if (ruleDay === day && rulePeriods.includes(period)) {
                  let isMatchSubj = (item.subId === ruleSubj || item.subName === ruleSubj);
                  if (ruleConstraint === "絕對不排" && isMatchSubj) {
                      hasConflict = true; conflictMsgs.push(`此時段依規則【絕對不排】該科目`);
                  }
                  if (ruleConstraint === "必須排入" && !isMatchSubj) {
                      hasConflict = true; conflictMsgs.push(`此時段依規則【只能排入】${ruleSubj}，不可放其他科目`);
                  }
              }
          }
      }

      if (hasConflict) {
          let msg = conflictMsgs.join("、");

    // ⭐ 方案4：排課後驗證 — 掃描完整課表，找出任何「同班同科目」在同一天
    // 出現超過2節、或出現2節但不相鄰(如上午+下午)的情況，回傳給使用者確認。
    // 正常情況下，經過方案2/3修正後這裡應該永遠是空陣列；若有資料是「匯入」或
    // 舊有課表殘留手動排定的內容，這道驗證可以當作最後一層防線把問題揪出來。
    function validateFragmentationIssues(timetableArr) {
        const consecPairsForCheck = [['1','2'], ['2','3'], ['3','4'], ['5','6'], ['6','7']];
        let grouped = {};
        timetableArr.forEach(t => {
            // 判斷是否為導師課程或本土語：這兩類不檢查切割
            let clsObj = globalScheduleData.classes.find(c => c.id === t.classId);
            let isHomeroom = clsObj && clsObj.homeroomId === t.teaId && t.teaId !== "";
            let isLocal = (t.subName || "").includes("本土") || (t.subName || "").includes("閩") || (t.subName || "").includes("客");
            if (isHomeroom || isLocal) return; // 導師課程、本土語跳過

            let k = `${t.classId}|${t.subId}|${t.day}`;
            if (!grouped[k]) grouped[k] = [];
            grouped[k].push(t.period);
        });
        let issues = [];
        for (let k in grouped) {
            let periods = grouped[k];
            let [classId, subId, day] = k.split('|');
            if (periods.length > 2) {
                issues.push({ classId, subId, day, periods, type: '同日超過2節' });
            } else if (periods.length === 2) {
                let isConsecPair = consecPairsForCheck.some(pair => periods.includes(pair[0]) && periods.includes(pair[1]));
                if (!isConsecPair) {
                    issues.push({ classId, subId, day, periods, type: '同日2節但不相鄰' });
                }
            }
        }
        return issues;
    }

    function formatFragmentationIssues(issues) {
        if (!issues || issues.length === 0) return "";
        let lines = issues.slice(0, 15).map(iss => {
            let cName = globalScheduleData.classes.find(c => c.id === iss.classId)?.name || iss.classId;
            let sName = globalScheduleData.subjects[iss.subId] || iss.subId;
            return `・${cName} ${sName}（${iss.day}，第${iss.periods.join('、')}節）— ${iss.type}`;
        }).join('\n');
        let more = issues.length > 15 ? `\n...等共 ${issues.length} 筆` : "";
        return `\n\n⚠️ 偵測到以下課程仍有同日切割問題，建議手動檢查調整：\n${lines}${more}`;
    }

    //    確保時段規則(黑白名單)、負荷上限、鎖定課程保護在所有階段一致生效。

    const RESCUE_VALID_PERIODS = () => SCHEDULE_FRAME.filter(f => f.type === 'class').map(f => f.id);
    const RESCUE_CONSEC_PAIRS = [['1','2'], ['2','3'], ['3','4'], ['5','6'], ['6','7']];

    // 判斷一筆課表紀錄是否為「鎖定(預排)」— 鎖定的課絕對不能被移動/互換/移除
    function isLockedRecord(t) {
        if (!t) return false;

    // 完整的時段合法性檢查（模組級版本，規則即時從 globalScheduleData 讀取）
    function checkSlotFully(lesson, day, period, timetableState) {
        if (!globalScheduleData) return false;
        if (period === "M" && !lesson.isSpecial) return false;

        let timeRules = globalScheduleData.rules.filter(r => r.dim === "絕對不排課時段" || r.dim === "僅限可用時段");
        let loadRules = globalScheduleData.rules.filter(r => r.dim === "計數器與負荷上限");
        let subjectTimeRules = globalScheduleData.rules.filter(r => r.dim === "特定時段科目限制");
        let specialRules = globalScheduleData.rules.filter(r => r.dim === "特殊排課優化");
        let isAdminOpt = specialRules.some(r => r.code === "行政" && r.param.includes("集中排課:是"));

        let slotOccupants = timetableState.filter(t => t.day === day && t.period === period);

        let lessonTeachers = [lesson.teaId];
        if (lesson.isCoTeach || (lesson.subName || "").includes("外師")) {
            let hrId = globalScheduleData.classes.find(c=>c.id===lesson.classId)?.homeroomId;
            if (hrId) lessonTeachers.push(hrId);
        }
        let lType = (lesson.subName||"").includes("單週") ? "ODD" : ((lesson.subName||"").includes("雙週") ? "EVEN" : "FULL");

        // 班級衝突 + 教師衝突
        for (let ex of slotOccupants) {
            if (ex.classId === lesson.classId) {
                let eType = (ex.subName||"").includes("單週") ? "ODD" : ((ex.subName||"").includes("雙週") ? "EVEN" : "FULL");
                let exRole = (globalScheduleData.teachers.find(t=>t.id===ex.teaId)?.role || "");
                let isExSpecial = (ex.subName||"").includes("資源") || (ex.subName||"").includes("特教") || exRole.includes("特教") || exRole.includes("教支");
                let isExHomeroom = (ex.teaId === globalScheduleData.classes.find(c=>c.id===ex.classId)?.homeroomId && ex.teaId !== "");
                let isExLocal = (ex.subName||"").includes("本土") || (ex.subName||"").includes("閩") || (ex.subName||"").includes("客");
                if ((eType === "ODD" && lType === "EVEN") || (eType === "EVEN" && lType === "ODD")) {
                } else if ((isExSpecial && lesson.isHomeroom) || (lesson.isSpecial && isExHomeroom)) {
                    continue;
                } else if (isExLocal && lesson.isLocal) {
                } else {
                    return false;
                }
            }
            let exTeachers = [ex.teaId];
            if ((ex.subName||"").includes("外師") || ex.isCoTeach) {
                let exHrId = globalScheduleData.classes.find(c=>c.id===ex.classId)?.homeroomId;
                if (exHrId) exTeachers.push(exHrId);
            }
            for (let t of lessonTeachers) {
                if (t !== "" && exTeachers.includes(t)) {
                    let eType = (ex.subName||"").includes("單週") ? "ODD" : ((ex.subName||"").includes("雙週") ? "EVEN" : "FULL");
                    if (eType === "FULL" || lType === "FULL" || eType === lType) return false;
                }
            }
        }

        // 教室衝突
        let lessonRoomId = lesson.expectedRoomId || getRoomIdForLesson(lesson.classId, lesson.subId, lesson.subName);
        if (lessonRoomId && lessonRoomId !== "ROOM_HOME") {
            let roomBusy = slotOccupants.some(ex => {
                let exRoomId = ex.roomId || getRoomIdForLesson(ex.classId, ex.subId, ex.subName);
                return exRoomId === lessonRoomId;
            });
            if (roomBusy) return false;
        }

        // 特定時段科目限制
        for (let r of subjectTimeRules) {
            if (r.type === "年級" && r.code.split(',').includes(lesson.grade)) {
                let params = Object.fromEntries(r.param.split(';').map(p => p.split(':')));
                if (params['星期'] === day && (params['節次'] ? params['節次'].split(',') : []).includes(period)) {
                    let isMatchSubj = (lesson.subId === params['科目'] || lesson.subName === params['科目']);
                    if (params['限制'] === "絕對不排" && isMatchSubj) return false;
                    if (params['限制'] === "必須排入" && !isMatchSubj) return false;
                }
            }
        }

        // 時段黑白名單（全校/年級/教師三層）
        let matchesTarget = (r) => {
            if (r.type === "全校") return true;
            if (r.type === "教師" && (r.code === lesson.teaId || r.code === globalScheduleData.teachers.find(t=>t.id===lesson.teaId)?.name)) return true;
            if (r.type === "年級" && r.code.split(',').includes(lesson.grade)) return true;
            return false;
        };
        let matchesTime = (r) => {
            let params = Object.fromEntries(r.param.split(';').map(p => p.split(':')));
            let ruleDay = params['星期']; let rulePeriods = params['節次'] ? params['節次'].split(',') : [];
            if (ruleDay === "每天" || ruleDay === day) { if (rulePeriods.includes(period)) return true; }
            return false;
        };
        let targetWhitelists = timeRules.filter(r => r.dim === "僅限可用時段" && matchesTarget(r));
        if (targetWhitelists.length > 0) {
            if (!targetWhitelists.some(r => matchesTime(r))) return false;
        }
        let targetBlacklists = timeRules.filter(r => r.dim === "絕對不排課時段" && matchesTarget(r));
        for (let r of targetBlacklists) { if (matchesTime(r)) return false; }

        // 負荷上限
        for (let r of loadRules) {
            if (r.code !== "導師" && r.code !== "科任") continue;
            if (isAdminOpt && lesson.role && lesson.role.includes("行政")) continue;
            if (r.code === "導師" && !lesson.isHomeroom) continue;
            if (r.code === "科任" && lesson.isHomeroom) continue;
            let params = Object.fromEntries(r.param.split(';').map(p => p.split(':')));
            let exclGrades = (params['排除年級'] || "").split(',');
            if (exclGrades.includes(lesson.grade)) continue;
            let limitVal = parseInt(params['數值']) || 99; let condition = params['條件'];
            if (condition === '單日上午節數上限' && ['1','2','3','4'].includes(period)) {
                if (timetableState.filter(t => t.teaId === lesson.teaId && t.day === day && ['1','2','3','4'].includes(t.period)).length >= limitVal) return false;
            }
            if (condition === '單日下午節數上限' && ['5','6','7'].includes(period)) {
                if (timetableState.filter(t => t.teaId === lesson.teaId && t.day === day && ['5','6','7'].includes(t.period)).length >= limitVal) return false;
            }
            if (condition === '單日總節數上限') {
                if (timetableState.filter(t => t.teaId === lesson.teaId && t.day === day).length >= limitVal) return false;
            }
        }
        return true;
    }

    function runAutoSchedule() {
      if (!globalScheduleData || globalScheduleData.assignments.length === 0) { return alert("尚無配課資料可供排課！"); }
      const btn = document.querySelector('.ai-btn'); btn.disabled = true; showStatus("statusTimetable", "運算中...", true);

      setTimeout(() => {
        // ⭐ 記錄「按下 AI 排課的當下」課表裡所有的課 —— 這些都是「手動預排」，
        //    AI 排完後全部標記為鎖定，不管跑幾次 AI 都不會被動到。
        //    (資源班、本土語、特定教師課等都靠這個機制鎖住)
        let preScheduledSnapshot = globalScheduleData.timetable.map(t => ({...t}));

        let timeRules = globalScheduleData.rules.filter(r => r.dim === "絕對不排課時段" || r.dim === "僅限可用時段");
        let loadRules = globalScheduleData.rules.filter(r => r.dim === "計數器與負荷上限");
        let roomRules = globalScheduleData.rules.filter(r => r.dim === "專科教室與連堂");
        let subjectTimeRules = globalScheduleData.rules.filter(r => r.dim === "特定時段科目限制"); 
        
        let specialRules = globalScheduleData.rules.filter(r => r.dim === "特殊排課優化");
        let isAdminOptimizationEnabled = specialRules.some(r => r.code === "行政" && r.param.includes("集中排課:是"));

        let consecMap = {};
        roomRules.forEach(r => {
            let params = Object.fromEntries(r.param.split(';').map(p => p.split(':')));
            if (params['連堂'] === "是") { r.code.split(',').forEach(g => { consecMap[`G${g}_${params['科目']}`] = true; }); }
        });

        let scheduledCount = {};
        globalScheduleData.timetable.forEach(t => { let key = `${t.classId}_${t.subId}_${t.teaId}`; scheduledCount[key] = (scheduledCount[key] || 0) + 1; });

        let pendingLessons = [];
        
        let processAssignment = (a) => {
            if (a.hours <= 0) return;
            let key = `${a.classId}_${a.subId}_${a.teaId}`; let placed = scheduledCount[key] || 0; let remain = a.hours - placed;
            if (remain <= 0) return;
            
            let tObj = globalScheduleData.teachers.find(t => t.id === a.teaId); let role = tObj ? tObj.role : "";
            let clsObj = globalScheduleData.classes.find(c => c.id === a.classId);
            let isHomeroom = clsObj && (clsObj.homeroomId === a.teaId && a.teaId !== "");
            let grade = clsObj ? (clsObj.name.match(/\d+/) ? clsObj.name.match(/\d+/)[0] : "0") : "0";
            
            let isSpecial = a.subName.includes("資源") || a.subName.includes("特教") || role.includes("特教") || role.includes("教支");
            let isLocal = a.subName.includes("本土") || a.subName.includes("閩") || a.subName.includes("客");

            let targetRoom = "ROOM_HOME";
            let targetSpecialHours = 0;
            let isConsec = false;

            let matchingRule = roomRules.find(r => {
                let grades = r.code.split(',');
                let params = Object.fromEntries(r.param.split(';').map(p => p.split(':')));
                return grades.includes(grade) && (params['科目'] === a.subId || params['科目'] === a.subName);
            });

            if (matchingRule) {
                let params = Object.fromEntries(matchingRule.param.split(';').map(p => p.split(':')));
                targetRoom = params['教室'];
                if (!targetRoom.startsWith('R_') && targetRoom !== "ROOM_HOME") {
                    let rObj = globalScheduleData.rooms.find(rm => rm.name === targetRoom);
                    if (rObj) targetRoom = rObj.id;
                }
                targetSpecialHours = parseInt(params['節數'] || params['排入節數']) || 0;
                isConsec = params['連堂'] === "是";
            }

            let existingSlots = globalScheduleData.timetable.filter(t => t.classId === a.classId && t.subId === a.subId);
            let placedSpecial = existingSlots.filter(t => {
                let rId = t.roomId || getRoomIdForLesson(t.classId, t.subId, t.subName);
                return rId && rId !== "ROOM_HOME";
            }).length;
            
            let remainSpecial = Math.max(0, targetSpecialHours - placedSpecial);

            // ⭐ 方案3：附上 groupKey / blockSize，供後續驗證與追蹤同一(班級+科目+教師)的所有區塊
            let pushBlock = (size, rm, consecFlag) => {
                pendingLessons.push({ classId: a.classId, subId: a.subId, teaId: a.teaId, subName: a.subName, role: role, grade: grade, consec: consecFlag, isHomeroom: isHomeroom, isCoTeach: a.isCoTeach, expectedRoomId: rm, isSpecial: isSpecial, isLocal: isLocal, groupKey: key, blockSize: size });
            };

            // ⭐ 方案3核心：與其把節數逐節丟給引擎、讓它各自決定要不要湊成同一天，
            // 不如「排課前先切塊」——固定切成「2連堂＋(可能的)1單節」的區塊，
            // 每個區塊本身就是不可分割的最小單位。這樣引擎只需要決定「這幾個區塊要落在哪幾天」，
            // 而「不會同一天出現3節」「同一天2節必相鄰」這件事，光靠區塊的原子性就已經結構性保證，
            // 不再需要靠事後計分去嚇阻。
            // 僅在「行政集中排課」且該老師具行政身份時套用（呼應原本集中排課的設計範圍），
            // 一般老師仍保留原本彈性（同科節數可分散到不同天，也受方案2的硬性防切割規則保護）。
            let createBlocks = (hrs, rm, consecFlag, allowChunkPacking) => {
                let h = hrs;
                if (consecFlag && h >= 2) {
                    pushBlock(2, rm, true);
                    h -= 2;
                }
                if (allowChunkPacking) {
                    while (h >= 2) { pushBlock(2, rm, true); h -= 2; }
                    if (h === 1) { pushBlock(1, rm, false); }
                } else {
                    for (let i = 0; i < h; i++) { pushBlock(1, rm, false); }
                }
            };

            let isConcentrationTarget = isAdminOptimizationEnabled && role.includes("行政");

            if (remainSpecial > 0) {
                let alloc = Math.min(remain, remainSpecial);
                createBlocks(alloc, targetRoom, isConsec, false); // 專科教室連堂規則已強制指定，不做二次切塊
                remain -= alloc;
            }
            if (remain > 0) {
                createBlocks(remain, "ROOM_HOME", false, isConcentrationTarget);
            }
        };

        globalScheduleData.assignments.forEach(a => { processAssignment(a); });

        if (pendingLessons.length === 0) { btn.disabled = false; btn.innerText = "✨ AI 接手安排剩餘節數"; showStatus("statusTimetable", "", false); return alert("太棒了！所有課程皆已排定，無剩餘節數。"); }

        const validPeriods = SCHEDULE_FRAME.filter(f => f.type === 'class').map(f => f.id);
        const consecPairs = [['1','2'], ['2','3'], ['3','4'], ['5','6'], ['6','7']]; 
        
        function isSlotValid(lesson, day, period, virtualTimetableState) {
          if (period === "M" && !lesson.isSpecial) return false; // ⭐ 嚴格阻擋非特殊課程進入 M 時段
          
          let slotOccupants = virtualTimetableState.filter(t => t.day === day && t.period === period);
          
          let lessonTeachers = [lesson.teaId];
          if (lesson.isCoTeach || lesson.subName.includes("外師")) {
               let hrId = globalScheduleData.classes.find(c=>c.id===lesson.classId)?.homeroomId;
               if (hrId) lessonTeachers.push(hrId);
          }
          let lType = lesson.subName.includes("單週") ? "ODD" : (lesson.subName.includes("雙週") ? "EVEN" : "FULL");

          for (let ex of slotOccupants) {
               if (ex.classId === lesson.classId) {
                   let eType = ex.subName.includes("單週") ? "ODD" : (ex.subName.includes("雙週") ? "EVEN" : "FULL");
                   let exRole = (globalScheduleData.teachers.find(t=>t.id===ex.teaId)?.role || "");
                   let isExSpecial = ex.subName.includes("資源") || ex.subName.includes("特教") || exRole.includes("特教") || exRole.includes("教支");
                   let isExHomeroom = (ex.teaId === globalScheduleData.classes.find(c=>c.id===ex.classId)?.homeroomId && ex.teaId !== "");
                   let isExLocal = ex.subName.includes("本土") || ex.subName.includes("閩") || ex.subName.includes("客");

                   if ((eType === "ODD" && lType === "EVEN") || (eType === "EVEN" && lType === "ODD")) {
                   } else if ((isExSpecial && lesson.isHomeroom) || (lesson.isSpecial && isExHomeroom)) {

                   } else if (isExLocal && lesson.isLocal) {

          }

          let lessonRoomId = lesson.expectedRoomId;

          for (let r of subjectTimeRules) {

                  let ruleDay = params['星期'];
                  let rulePeriods = params['節次'] ? params['節次'].split(',') : [];
                  let ruleSubj = params['科目'];

                      if (ruleConstraint === "絕對不排" && isMatchSubj) {

          let matchesTarget = (r) => {

          let matchesTime = (r) => {

              if (ruleDay === "每天" || ruleDay === day) { if (rulePeriods.includes(period)) return true; }

          if (targetWhitelists.length > 0) {

              let limitVal = parseInt(params['數值']) || 99; let condition = params['條件'];
              if (condition === '單日上午節數上限' && ['1','2','3','4'].includes(period)) {
                  let count = virtualTimetableState.filter(t => t.teaId === lesson.teaId && t.day === day && ['1','2','3','4'].includes(t.period)).length;
                  if (count >= limitVal) return false;

        }

        const baseTimetable = [...globalScheduleData.timetable];

        if (isAdminOptimizationEnabled) {
            let vipLessons = pendingLessons.filter(l => l.role.includes("行政"));
            let teachersVIP = [...new Set(vipLessons.map(l => l.teaId))];

            teachersVIP.forEach(tId => {
                let teacherLessons = vipLessons.filter(l => l.teaId === tId);

                // ⭐ 核心改造：按「班級+科目」分組，形成 courseGroup
                // 每個 courseGroup 的區塊必須落在「不同天」，從根源杜絕同日切割
                let courseMap = {};
                teacherLessons.forEach(l => {

                let allBlocks = [];
                for (let ck in courseMap) {

                allBlocks.forEach(({ lesson, ck }) => {
                    let placed = false;

                    // 計算這個 courseGroup(班級+科目) 在各天已排了幾節
                    let dayUsage = {};
                    baseTimetable.filter(t => t.classId === lesson.classId && t.subId === lesson.subId)
                        .forEach(t => { dayUsage[t.day] = (dayUsage[t.day] || 0) + 1; });

                    // 計算該老師在各天已有幾節（用於集中出勤排序）

                        .forEach(t => { teacherDayLoad[t.day] = (teacherDayLoad[t.day] || 0) + 1; });

                    // 過濾候選天：這個班級+科目在該天排完此區塊後不能超過2節
                    let candidateDays = DAYS.filter(d => {
                        let existing = dayUsage[d] || 0;

                    });

                    // 集中排課：優先選老師已有課的天（減少出勤天數）
                    candidateDays.sort((a, b) => (teacherDayLoad[b] || 0) - (teacherDayLoad[a] || 0));

                    for (let day of candidateDays) {
                        if (placed) break;

                        if (lesson.consec) {
                            for (let pair of consecPairs) {
                                if (isSlotValid(lesson, day, pair[0], baseTimetable) &&
                                    isSlotValid(lesson, day, pair[1], baseTimetable)) {
                                    baseTimetable.push({ classId: lesson.classId, day: day, period: pair[0], subId: lesson.subId, teaId: lesson.teaId, subName: lesson.subName, isCoTeach: lesson.isCoTeach, roomId: lesson.expectedRoomId });
                                    baseTimetable.push({ classId: lesson.classId, day: day, period: pair[1], subId: lesson.subId, teaId: lesson.teaId, subName: lesson.subName, isCoTeach: lesson.isCoTeach, roomId: lesson.expectedRoomId });
                                    placed = true;

                            }

                            // 單節：若該天已有同科1節，只允許相鄰的位置
                            let existingToday = baseTimetable.filter(t =>
                                t.classId === lesson.classId && t.subId === lesson.subId && t.day === day
                            );
                            for (let p of validPeriods) {
                                if (existingToday.length === 1) {
                                    let existingP = existingToday[0].period;
                                    let wouldBeConsec = consecPairs.some(pair =>
                                        (pair[0] === existingP && pair[1] === p) ||

                                    if (!wouldBeConsec) continue;
                                }
                                if (isSlotValid(lesson, day, p, baseTimetable)) {
                                    baseTimetable.push({ classId: lesson.classId, day: day, period: p, subId: lesson.subId, teaId: lesson.teaId, subName: lesson.subName, isCoTeach: lesson.isCoTeach, roomId: lesson.expectedRoomId });
                                    placed = true;

                                }
                            }

                    if (placed) {

                    }
                });
            });
        }

        let validSlotsForLesson = [];
        for (let i=0; i<pendingLessons.length; i++) {
            let lesson = pendingLessons[i]; let options = [];
            
            let matchesTarget = (r) => {
              if (r.type === "全校") return true;
              if (r.type === "教師" && (r.code === lesson.teaId || r.code === globalScheduleData.teachers.find(t=>t.id===lesson.teaId)?.name)) return true;
              if (r.type === "年級" && r.code.split(',').includes(lesson.grade)) return true;

            };
            let targetWhitelists = timeRules.filter(r => r.dim === "僅限可用時段" && matchesTarget(r));
            let targetBlacklists = timeRules.filter(r => r.dim === "絕對不排課時段" && matchesTarget(r));

            let isTimeOk = (day, period) => {
                if (period === "M" && !lesson.isSpecial) return false; // ⭐ 再次確保一般課程不會取得 M 選項
                let matchesTime = (r, d, p) => {
                    let params = Object.fromEntries(r.param.split(';').map(p => p.split(':')));
                    if (params['星期'] !== "每天" && params['星期'] !== d) return false;
                    return (params['節次'] ? params['節次'].split(',') : []).includes(p);
                };
                if (targetWhitelists.length > 0 && !targetWhitelists.some(r => matchesTime(r, day, period))) return false;
                for (let r of targetBlacklists) { if (matchesTime(r, day, period)) return false; }
                return true;
            };

            if (lesson.consec) {
                for(let day of DAYS) { for(let pair of consecPairs) { if(isTimeOk(day, pair[0]) && isTimeOk(day, pair[1])) {
                    // ⭐ 防切割：僅限行政/科任，導師和本土語不受限
                    if (!lesson.isHomeroom && !lesson.isLocal) {

                        if (sameDayCount + 2 > 2) continue;

            } else {
                for(let day of DAYS) { for(let p of validPeriods) { if(isTimeOk(day, p)) {
                    // ⭐ 防切割：僅限行政/科任，導師和本土語不受限
                    if (!lesson.isHomeroom && !lesson.isLocal) {
                        let sameDaySlots = baseTimetable.filter(t => t.classId === lesson.classId && t.subId === lesson.subId && t.day === day);
                        if (sameDaySlots.length >= 2) continue;
                        if (sameDaySlots.length === 1) {

                            let wouldBeConsec = consecPairs.some(pair =>

        }

        const numParticles = 30; const maxIterations = 500;
        let w = 0.9; const c1 = 2.0; const c2 = 2.0;
        
        // ⭐ 方案2：同科同日切割的硬性懲罰值。刻意設得遠大於任何可能的「集中排課」加分
        // (activeDays*4000、amPm合併2000、isolatedPenalty*500 等全部加總都不可能超過此值)，
        // 讓 PSO 在數學上等同於把「同日切割」當成硬性約束來對待，不會再被集中排課的誘因蓋過。
        const FRAGMENT_HARD_PENALTY = 2000000;

        let evaluateFitness = (position) => {
            let score = 0;
            let classGrid = {}; let teacherGrid = {}; let roomGrid = {};
            let subjTrack = {}; // ⭐ 記錄每班每日每科目被排入的節次，用於同科同日防切割檢查

                if(!classGrid[t.classId]) classGrid[t.classId] = {};

                let slot = classGrid[t.classId][t.day][t.period] || 0;
                let mask = 0;
                if (tType === "ODD") mask = 1;
                else if (tType === "EVEN") mask = 2;
                else if (isSpecial) mask = 4;

                     let hrId = globalScheduleData.classes.find(c=>c.id===t.classId)?.homeroomId;

                if(rId && rId !== "ROOM_HOME") { if(!roomGrid[rId]) roomGrid[rId] = {}; if(!roomGrid[rId][t.day]) roomGrid[rId][t.day] = {}; roomGrid[rId][t.day][t.period] = true; }

                if(!subjTrack[t.classId]) subjTrack[t.classId] = {};
                if(!subjTrack[t.classId][t.day]) subjTrack[t.classId][t.day] = {};
                if(!subjTrack[t.classId][t.day][t.subId]) subjTrack[t.classId][t.day][t.subId] = { periods: [], isHomeroom: isHomeroom, isLocal: isLocal };
                subjTrack[t.classId][t.day][t.subId].periods.push(t.period);
            });

            for(let i=0; i<pendingLessons.length; i++) {
                let slotIdx = position[i]; let slot = validSlotsForLesson[i][slotIdx]; if(!slot) continue; 
                let lesson = pendingLessons[i];
                let lType = lesson.subName.includes("單週") ? "ODD" : (lesson.subName.includes("雙週") ? "EVEN" : "FULL");
                
                let checkAndMark = (day, p) => {
                    let mask = 0;
                    if (lType === "ODD") mask = 1;
                    else if (lType === "EVEN") mask = 2;
                    else if (lesson.isSpecial) mask = 4;
                    else if (lesson.isHomeroom) mask = 8;
                    else if (lesson.isLocal) mask = 16;
                    else mask = 32;

                    let currentSlot = (classGrid[lesson.classId] && classGrid[lesson.classId][day] && classGrid[lesson.classId][day][p]) ? classGrid[lesson.classId][day][p] : 0;
                    
                    if (currentSlot !== 0) {
                        let conflict = false;
                        if (mask === 1 && (currentSlot === 2)) { }
                        else if (mask === 2 && (currentSlot === 1)) { }
                        else if (mask === 4 && (currentSlot === 8)) { }
                        else if (mask === 8 && (currentSlot === 4)) { }
                        else if (mask === 16 && (currentSlot === 16)) { }
                        else conflict = true;

                        if (conflict) score += 1000;
                    }

                    if(!classGrid[lesson.classId]) classGrid[lesson.classId] = {}; 
                    if(!classGrid[lesson.classId][day]) classGrid[lesson.classId][day] = {}; 
                    classGrid[lesson.classId][day][p] = currentSlot | mask;

                            let ext = teacherGrid[tId] && teacherGrid[tId][day] ? teacherGrid[tId][day][p] : null;
                            if (ext) {
                                if (ext === "FULL" || lType === "FULL" || ext === lType) score += 1000;
                                else teacherGrid[tId][day][p] = "FULL"; 
                            } else {
                                if(!teacherGrid[tId]) teacherGrid[tId] = {}; if(!teacherGrid[tId][day]) teacherGrid[tId][day] = {};
                                teacherGrid[tId][day][p] = lType;

                    }

                    let rId = lesson.expectedRoomId;
                    if(rId && rId !== "ROOM_HOME") {
                        if(roomGrid[rId] && roomGrid[rId][day] && roomGrid[rId][day][p]) score += 1000;
                        if(!roomGrid[rId]) roomGrid[rId] = {}; if(!roomGrid[rId][day]) roomGrid[rId][day] = {}; roomGrid[rId][day][p] = true;
                    }

                    if(!subjTrack[lesson.classId]) subjTrack[lesson.classId] = {};
                    if(!subjTrack[lesson.classId][day]) subjTrack[lesson.classId][day] = {};
                    if(!subjTrack[lesson.classId][day][lesson.subId]) subjTrack[lesson.classId][day][lesson.subId] = { periods: [], isHomeroom: lesson.isHomeroom, isLocal: lesson.isLocal };
                    subjTrack[lesson.classId][day][lesson.subId].periods.push(p);
                };
                if(slot.isConsec) { checkAndMark(slot.day, slot.periods[0]); checkAndMark(slot.day, slot.periods[1]); } else { checkAndMark(slot.day, slot.period); }
            }

            // ⭐ 方案2：同科單日極限與碎塊硬性懲罰（僅限行政/科任，導師不受限）
            for (let cid in subjTrack) {
                for (let d in subjTrack[cid]) {
                    for (let sid in subjTrack[cid][d]) {
                        let entry = subjTrack[cid][d][sid];
                        if (entry.isHomeroom || entry.isLocal) continue; // 導師課程、本土語不受防切割限制
                        let pList = entry.periods;
                        if (pList.length > 2) {
                            score += FRAGMENT_HARD_PENALTY;
                        } else if (pList.length === 2) {
                            let isConsecPair = consecPairs.some(pair => pList.includes(pair[0]) && pList.includes(pair[1]));
                            if (!isConsecPair) {
                                score += FRAGMENT_HARD_PENALTY;
                            }
                        }
                    }
                }
            }

            // 行政集中排課：老師出勤天數越少分數越高（此加分永遠小於 FRAGMENT_HARD_PENALTY，
            // 不可能反過來誘使系統接受同科切割）
            if (isAdminOptimizationEnabled) {
                for (let tId in teacherGrid) {
                    let tObj = globalScheduleData.teachers.find(t => t.id === tId);
                    if (tObj && tObj.role.includes("行政")) {
                        let activeDays = 0;
                        for (let day of DAYS) {
                            if (!teacherGrid[tId][day]) continue;
                            let amCount = 0; let pmCount = 0;
                            let dayClasses = 0;
                            let periods = ['1','2','3','4','5','6','7'];
                            periods.forEach(p => {
                                if (teacherGrid[tId][day][p]) {
                                    dayClasses++;
                                    if (['1','2','3','4'].includes(p)) amCount++;
                                    else if (['5','6','7'].includes(p)) pmCount++;
                                }
                            });

                            if (dayClasses > 0) {
                                activeDays++;
                                if (amCount > 0 && pmCount > 0) {
                                    score += 2000; 
                                }

                                let consecutive = 0;
                                if (teacherGrid[tId][day]['1'] && teacherGrid[tId][day]['2']) consecutive++;
                                if (teacherGrid[tId][day]['2'] && teacherGrid[tId][day]['3']) consecutive++;
                                if (teacherGrid[tId][day]['3'] && teacherGrid[tId][day]['4']) consecutive++;
                                if (teacherGrid[tId][day]['5'] && teacherGrid[tId][day]['6']) consecutive++;
                                if (teacherGrid[tId][day]['6'] && teacherGrid[tId][day]['7']) consecutive++;

                                let isolatedPenalty = Math.max(0, dayClasses - consecutive - 1);
                                score += isolatedPenalty * 500;
                            }
                        }
                        score += activeDays * 4000;
                    }
                }
            }

            return score;
        };

        let swarm = []; let gBest = { position: [], fitness: Infinity };

        // ⭐ 根據使用者選擇的引擎執行不同排課策略
        //    三個引擎最終產出相同的 gBest.position（每個 pending lesson 的時段索引），
        //    然後統一交給 runGreedyAndSwap 進行後處理、鎖定標記、寫回課表。
        let selectedEngine = document.getElementById('engineSelect')?.value || 'backtrack';

        // ============================================================
        // 引擎 1：穩定回溯 (Backtracking + MRV + LCV)
        //   - MRV(Most Constrained Variable)：選最受約束的課先排
        //   - LCV(Least Constraining Value)：選對後續影響最小的時段
        //   - 有解必找到、結果穩定可重現、失敗時可回報卡關原因
        // ============================================================
        function runBacktrackEngine() {
            btn.innerText = `🎯 穩定回溯運算中...`;

            // 各 lesson 目前的候選時段（會隨排課過程收縮）
            let candidateSlots = validSlotsForLesson.map(opts => opts.map((_, idx) => idx));
            let assignment = new Array(pendingLessons.length).fill(-1);
            let occupancyTable = [...baseTimetable]; // 動態的課表狀態

            // 計算某 lesson 選某時段的「約束傳播影響」：會讓多少其他 lesson 少幾個選項
            let countConstrainingImpact = (lIdx, slotIdx) => {
                let slot = validSlotsForLesson[lIdx][slotIdx];
                if (!slot) return 999999;
                let impact = 0;
                let lesson = pendingLessons[lIdx];
                for (let j = 0; j < pendingLessons.length; j++) {
                    if (j === lIdx || assignment[j] !== -1) continue;
                    let otherLesson = pendingLessons[j];
                    // 只計算「可能相互影響」的 lesson（同班或同教師或同教室）
                    if (otherLesson.classId !== lesson.classId && otherLesson.teaId !== lesson.teaId && otherLesson.expectedRoomId !== lesson.expectedRoomId) continue;
                    // 檢查 j 的候選中，有多少會被 slot 影響
                    let jSlots = validSlotsForLesson[j];
                    let daysToCheck = slot.isConsec ? [slot.day] : [slot.day];
                    let periodsToCheck = slot.isConsec ? slot.periods : [slot.period];
                    for (let k of candidateSlots[j]) {
                        let jSlot = jSlots[k];
                        if (!jSlot || jSlot.day !== slot.day) continue;
                        let jPeriods = jSlot.isConsec ? jSlot.periods : [jSlot.period];
                        for (let p of periodsToCheck) { if (jPeriods.includes(p)) { impact++; break; } }
                    }
                }
                return impact;
            };

            // MRV：找候選最少的未排 lesson
            let pickNextVariable = () => {
                let best = -1, minCount = Infinity;
                for (let i = 0; i < pendingLessons.length; i++) {
                    if (assignment[i] !== -1) continue;
                    let cnt = candidateSlots[i].length;
                    if (cnt < minCount) { minCount = cnt; best = i; }
                    if (minCount === 0) break;
                }
                return best;
            };

            // 檢查 slot 是否與目前 occupancyTable 相容
            let canPlace = (lesson, slot) => {
                if (slot.isConsec) {
                    return checkSlotFully(lesson, slot.day, slot.periods[0], occupancyTable) &&
                           checkSlotFully(lesson, slot.day, slot.periods[1], occupancyTable);
                }
                return checkSlotFully(lesson, slot.day, slot.period, occupancyTable);
            };

            let addToTable = (lesson, slot) => {
                let recs = [];
                if (slot.isConsec) {
                    slot.periods.forEach(p => {
                        let r = { classId: lesson.classId, day: slot.day, period: p, subId: lesson.subId, teaId: lesson.teaId, subName: lesson.subName, isCoTeach: lesson.isCoTeach, roomId: lesson.expectedRoomId };
                        occupancyTable.push(r); recs.push(r);
                    });
                } else {
                    let r = { classId: lesson.classId, day: slot.day, period: slot.period, subId: lesson.subId, teaId: lesson.teaId, subName: lesson.subName, isCoTeach: lesson.isCoTeach, roomId: lesson.expectedRoomId };
                    occupancyTable.push(r); recs.push(r);
                }
                return recs;
            };
            let removeFromTable = (recs) => { recs.forEach(r => { let i = occupancyTable.indexOf(r); if (i !== -1) occupancyTable.splice(i, 1); }); };

            let startBT = Date.now();
            const BT_MAX_MS = 60000; // 60秒上限
            let backtrackCount = 0;

            let solve = () => {
                if (Date.now() - startBT > BT_MAX_MS) return false; // 超時
                let vIdx = pickNextVariable();
                if (vIdx === -1) return true; // 全部排完
                if (candidateSlots[vIdx].length === 0) return false; // 死胡同

                let lesson = pendingLessons[vIdx];
                // LCV：按「對其他 lesson 影響小」排序候選
                let orderedCands = [...candidateSlots[vIdx]].sort((a, b) => {
                    return countConstrainingImpact(vIdx, a) - countConstrainingImpact(vIdx, b);
                });

                for (let slotIdx of orderedCands) {
                    let slot = validSlotsForLesson[vIdx][slotIdx];
                    if (!slot || !canPlace(lesson, slot)) continue;

                    assignment[vIdx] = slotIdx;
                    let addedRecs = addToTable(lesson, slot);

                    if (solve()) return true;

                    // 回溯
                    assignment[vIdx] = -1;
                    removeFromTable(addedRecs);
                    backtrackCount++;
                    if (backtrackCount % 200 === 0) {
                        let elapsed = Math.floor((Date.now() - startBT) / 1000);
                        btn.innerText = `🎯 穩定回溯中... ${elapsed}秒 (已回溯 ${backtrackCount} 次)`;
                    }
                }
                return false;
            };

            let solved = solve();

            // 把結果轉成 gBest.position
            gBest.position = assignment.map((a, i) => a === -1 ? 0 : a);
            gBest.fitness = solved ? 0 : 999;

            if (!solved) {
                let unresolved = assignment.filter(a => a === -1).length;
                console.log(`回溯未能完全解決，剩餘 ${unresolved} 節，將交給後處理繼續嘗試`);
            }

            btn.innerText = `🔄 啟動動態互換與最終優化...`;
            setTimeout(runGreedyAndSwap, 50);
        }

        // ============================================================
        // 引擎 2：模擬退火 (Simulated Annealing)
        //   - 從隨機解出發，逐步降溫，接受劣解機率隨時間降低
        //   - 比 PSO 更擅長跳出局部最佳解，追求高品質排法
        // ============================================================
        function runSimulatedAnnealingEngine() {
            btn.innerText = `🌡️ 模擬退火運算中...`;

            // 初始解：每個 lesson 隨機選一個候選
            let current = pendingLessons.map((_, i) =>
                validSlotsForLesson[i].length > 0 ? Math.floor(Math.random() * validSlotsForLesson[i].length) : 0
            );
            let currentFit = evaluateFitness(current);
            let best = [...current]; let bestFit = currentFit;

            let temperature = 1000; const coolingRate = 0.995; const minTemp = 0.1;
            const maxIterSA = 20000;
            let startSA = Date.now();
            const SA_MAX_MS = 60000;
            let saIter = 0;

            function saChunk() {
                let chunkEnd = Date.now() + 300;
                while (Date.now() < chunkEnd && saIter < maxIterSA && temperature > minTemp) {
                    // 隨機挑一個變數，隨機換候選
                    let idx = Math.floor(Math.random() * pendingLessons.length);
                    if (validSlotsForLesson[idx].length <= 1) { saIter++; continue; }
                    let oldVal = current[idx];
                    let newVal;
                    do { newVal = Math.floor(Math.random() * validSlotsForLesson[idx].length); } while (newVal === oldVal);
                    current[idx] = newVal;
                    let newFit = evaluateFitness(current);
                    let delta = newFit - currentFit;
                    if (delta < 0 || Math.random() < Math.exp(-delta / temperature)) {
                        currentFit = newFit;
                        if (newFit < bestFit) { best = [...current]; bestFit = newFit; }
                    } else {
                        current[idx] = oldVal;
                    }
                    temperature *= coolingRate;
                    saIter++;
                }
                let elapsed = Math.floor((Date.now() - startSA) / 1000);
                btn.innerText = `🌡️ 模擬退火中... ${elapsed}秒 (第 ${saIter}/${maxIterSA} 代，分數 ${bestFit.toFixed(0)})`;

                if (bestFit === 0 || saIter >= maxIterSA || temperature <= minTemp || (Date.now() - startSA) >= SA_MAX_MS) {
                    gBest.position = best; gBest.fitness = bestFit;
                    btn.innerText = `🔄 啟動動態互換與最終優化...`;
                    setTimeout(runGreedyAndSwap, 50);
                } else {
                    setTimeout(saChunk, 0);
                }
            }
            saChunk();
        }

        // ============================================================
        // 引擎 3：PSO（現有引擎，保留當快速選項）
        // ============================================================
        function runPSOEngine() {
        for(let i=0; i<numParticles; i++) {
            let pos = []; for(let j=0; j<pendingLessons.length; j++) { pos.push(Math.floor(Math.random() * validSlotsForLesson[j].length)); }
            let fit = evaluateFitness(pos);
            let particle = { position: [...pos], pBest: [...pos], pBestFitness: fit, fitness: fit };
            swarm.push(particle);
            if(fit < gBest.fitness) { gBest.position = [...pos]; gBest.fitness = fit; }
        }

        let stagnationCounter = 0; let startTime = Date.now();
        let iter = 0;
        const maxTime = 90000; 

        function processPSOChunk() {
            let chunkEnd = Date.now() + 300; 
            let improved = false;

            while (Date.now() < chunkEnd && iter < maxIterations) {
                w = 0.9 - ((0.9 - 0.4) * (iter / maxIterations)); 
                for(let p of swarm) {
                    for(let j=0; j<pendingLessons.length; j++) {
                        if(validSlotsForLesson[j].length === 0) continue;
                        let r1 = Math.random(); let r2 = Math.random();
                        let w_term = w; let c1_term = c1 * r1; let c2_term = c2 * r2;
                        let total_w = w_term + c1_term + c2_term;
                        let roll = Math.random() * total_w;
                        if(roll < w_term) { p.position[j] = Math.floor(Math.random() * validSlotsForLesson[j].length); } 
                        else if (roll < w_term + c1_term) { p.position[j] = p.pBest[j]; } 
                        else { p.position[j] = gBest.position[j]; }
                    }
                    p.fitness = evaluateFitness(p.position);
                    if(p.fitness < p.pBestFitness) { p.pBest = [...p.position]; p.pBestFitness = p.fitness; }
                    if(p.fitness < gBest.fitness) { gBest.position = [...p.position]; gBest.fitness = p.fitness; improved = true; }
                }

                if(improved) stagnationCounter = 0; else stagnationCounter++;

                if (stagnationCounter >= 10 && gBest.fitness > 0) { 
                    stagnationCounter = 0;
                    for(let i=0; i<numParticles; i++) {
                        if(swarm[i].fitness === gBest.fitness) continue; 
                        for(let j=0; j<pendingLessons.length; j++) { swarm[i].position[j] = Math.floor(Math.random() * validSlotsForLesson[j].length); }
                        swarm[i].fitness = evaluateFitness(swarm[i].position);
                        swarm[i].pBest = [...swarm[i].position]; swarm[i].pBestFitness = swarm[i].fitness;
                    }
                }
                if(gBest.fitness === 0) break; 
                iter++;
            }

            let elapsed = Math.floor((Date.now() - startTime) / 1000);
            btn.innerText = `⏳ AI深度運算中... 耗時 ${elapsed}秒 (第 ${iter}/${maxIterations} 代)`;

            if (gBest.fitness === 0 || iter >= maxIterations || (Date.now() - startTime) >= maxTime) {
                btn.innerText = `🔄 啟動動態互換與最終優化...`;
                setTimeout(runGreedyAndSwap, 50); 
            } else {
                setTimeout(processPSOChunk, 0); 
            }
        }

            processPSOChunk();
        } // end runPSOEngine

        // ⭐ 引擎分發：根據使用者選擇執行對應引擎
        //    三個引擎最終都會呼叫 runGreedyAndSwap，共用相同的後處理、鎖定標記邏輯
        if (selectedEngine === 'backtrack') {
            runBacktrackEngine();
        } else if (selectedEngine === 'sa') {
            runSimulatedAnnealingEngine();
        } else {
            runPSOEngine();
        }

        function runGreedyAndSwap() {
            let virtualTimetable = [...baseTimetable];
            let placedCount = 0; let swapCount = 0;

            pendingLessons.sort((a, b) => {
              let getPriority = (lesson) => {
                let score = 0;
                if (lesson.consec) score += 100;
                if (lesson.role.includes("外師") || lesson.role.includes("外籍") || lesson.isCoTeach) score += 50;
                if (lesson.subName.includes("資源") || lesson.subName.includes("本土")) score += 40;
                if (!lesson.isHomeroom) score += 20; 
                return score;
              };
              return getPriority(b) - getPriority(a);
            });

            let attemptPlace = (lesson) => {
                let possibleSlots = [];
                if (lesson.consec) {
                    for (let day of DAYS) {
                        // ⭐ 防切割：僅限行政/科任，導師和本土語不受限
                        if (!lesson.isHomeroom && !lesson.isLocal) {
                            let sameDayCount = virtualTimetable.filter(t => t.classId === lesson.classId && t.subId === lesson.subId && t.day === day).length;
                            if (sameDayCount + 2 > 2) continue; // 若已排了1單節，再加連堂變3節，禁止
                        }
                        for (let pair of consecPairs) { if (isSlotValid(lesson, day, pair[0], virtualTimetable) && isSlotValid(lesson, day, pair[1], virtualTimetable)) possibleSlots.push({ day: day, periods: pair }); }
                    }
                } else {
                    for (let day of DAYS) {
                        // ⭐ 防切割：僅限行政/科任，導師和本土語不受限
                        if (!lesson.isHomeroom && !lesson.isLocal) {
                            let sameDaySlots = virtualTimetable.filter(t => t.classId === lesson.classId && t.subId === lesson.subId && t.day === day);
                            if (sameDaySlots.length >= 2) continue; // 同日最多2節
                            if (sameDaySlots.length === 1) {
                                // 此天已有1節同科，後面只允許相鄰節次，先記下來給內層迴圈用
                            }
                        }
                        for (let p of validPeriods) {
                            if (!lesson.isHomeroom && !lesson.isLocal) {
                                let sameDaySlots = virtualTimetable.filter(t => t.classId === lesson.classId && t.subId === lesson.subId && t.day === day);
                                if (sameDaySlots.length === 1) {
                                    let existingP = sameDaySlots[0].period;
                                    let wouldBeConsec = consecPairs.some(pair =>
                                        (pair[0] === existingP && pair[1] === p) ||
                                        (pair[1] === existingP && pair[0] === p)
                                    );
                                    if (!wouldBeConsec) continue;
                                }
                            }
                            if (isSlotValid(lesson, day, p, virtualTimetable)) possibleSlots.push({ day: day, period: p });
                        }
                    }
                }
                if (possibleSlots.length > 0) {
                    possibleSlots.sort(() => Math.random() - 0.5); let slot = possibleSlots[0];
                    if (lesson.consec) {
                        virtualTimetable.push({ classId: lesson.classId, day: slot.day, period: slot.periods[0], subId: lesson.subId, teaId: lesson.teaId, subName: lesson.subName, isCoTeach: lesson.isCoTeach, roomId: lesson.expectedRoomId });
                        virtualTimetable.push({ classId: lesson.classId, day: slot.day, period: slot.periods[1], subId: lesson.subId, teaId: lesson.teaId, subName: lesson.subName, isCoTeach: lesson.isCoTeach, roomId: lesson.expectedRoomId });
                    } else { virtualTimetable.push({ classId: lesson.classId, day: slot.day, period: slot.period, subId: lesson.subId, teaId: lesson.teaId, subName: lesson.subName, isCoTeach: lesson.isCoTeach, roomId: lesson.expectedRoomId }); }
                    return true;
                }
                return false;
            };

            let trySwapTeacherAndPlace = (lesson) => {
                if (lesson.isHomeroom || lesson.isCoTeach) return false; 
                
                let candidates = globalScheduleData.assignments.filter(a =>
                    a.subId === lesson.subId && a.classId !== lesson.classId && a.teaId !== "" &&
                    a.teaId !== globalScheduleData.classes.find(c=>c.id===a.classId)?.homeroomId && 
                    globalScheduleData.classes.find(c=>c.id===a.classId)?.name.match(/\d+/)[0] === lesson.grade &&
                    !a.isCoTeach
                );

                for (let cand of candidates) {
                    let teaA = lesson.teaId; let teaB = cand.teaId;
                    if (teaA === teaB) continue; 

                    let class1Records = virtualTimetable.filter(t => t.classId === lesson.classId && t.subId === lesson.subId);
                    let class2Records = virtualTimetable.filter(t => t.classId === cand.classId && t.subId === cand.subId);

                    // ⭐ 鎖定(預排)課程保護：任一方含有鎖定紀錄，就不進行互換
                    if (class1Records.some(isLockedRecord) || class2Records.some(isLockedRecord)) continue;

                    virtualTimetable = virtualTimetable.filter(t => !(t.classId === lesson.classId && t.subId === lesson.subId) && !(t.classId === cand.classId && t.subId === cand.subId));
                    class1Records.forEach(t => t.teaId = teaB); class2Records.forEach(t => t.teaId = teaA);

                    let allValid = true; let testGroup = [...class1Records, ...class2Records];
                    for (let r of testGroup) {
                        let rRole = globalScheduleData.teachers.find(t=>t.id===r.teaId)?.role || "";
                        let dummyLesson = { classId: r.classId, teaId: r.teaId, subId: r.subId, subName: r.subName, grade: lesson.grade, isHomeroom: r.teaId === globalScheduleData.classes.find(c=>c.id===r.classId)?.homeroomId, consec: false, role: rRole, isCoTeach: r.isCoTeach, expectedRoomId: r.roomId || getRoomIdForLesson(r.classId, r.subId, r.subName), isSpecial: r.subName.includes("資源") || r.subName.includes("特教") || rRole.includes("特教") || rRole.includes("教支"), isLocal: r.subName.includes("本土") || r.subName.includes("閩") || r.subName.includes("客") };
                        if (!isSlotValid(dummyLesson, r.day, r.period, virtualTimetable)) { allValid = false; break; }
                        virtualTimetable.push(r); 
                    }

                    if (!allValid) { 
                        virtualTimetable = virtualTimetable.filter(t => !testGroup.includes(t));
                        class1Records.forEach(t => t.teaId = teaA); class2Records.forEach(t => t.teaId = teaB);
                        virtualTimetable.push(...class1Records, ...class2Records);
                        continue;
                    }

                    lesson.teaId = teaB;
                    let placed = attemptPlace(lesson);
                    if (placed) {
                        swapCount++;
                        pendingLessons.forEach(pl => {
                            if (pl.classId === lesson.classId && pl.subId === lesson.subId) pl.teaId = teaB;
                            if (pl.classId === cand.classId && pl.subId === cand.subId) pl.teaId = teaA;
                        });
                        return true;
                    } else { 
                        virtualTimetable = virtualTimetable.filter(t => !testGroup.includes(t));
                        class1Records.forEach(t => t.teaId = teaA); class2Records.forEach(t => t.teaId = teaB);
                        virtualTimetable.push(...class1Records, ...class2Records);
                        lesson.teaId = teaA;
                    }
                }
                return false;
            }

            for (let i = 0; i < pendingLessons.length; i++) {
                let lesson = pendingLessons[i];
                if (attemptPlace(lesson)) { placedCount++; } 
                else if (trySwapTeacherAndPlace(lesson)) { placedCount++; }
            }

            // ====================================================================
            // ⭐ 救援策略1：放寬專科教室（不會動到任何已排課程，只是改用班級教室重試）
            // ====================================================================
            let unplacedLessons = [];
            {
                let placedTracker = {};
                virtualTimetable.forEach(t => {
                    let k = `${t.classId}_${t.subId}_${t.teaId}`;
                    placedTracker[k] = (placedTracker[k] || 0) + 1;
                });
                let consumed = {};
                for (let lesson of pendingLessons) {
                    let k = `${lesson.classId}_${lesson.subId}_${lesson.teaId}`;
                    let need = lesson.consec ? 2 : 1;
                    let available = (placedTracker[k] || 0) - (consumed[k] || 0);
                    if (available >= need) {
                        consumed[k] = (consumed[k] || 0) + need;
                    } else {
                        unplacedLessons.push(lesson);
                    }
                }
            }

            if (unplacedLessons.length > 0) {
                let rescued1 = 0;
                for (let lesson of [...unplacedLessons]) {
                    let originalRoom = lesson.expectedRoomId;
                    if (originalRoom && originalRoom !== "ROOM_HOME") {
                        lesson.expectedRoomId = "ROOM_HOME";
                        if (attemptPlace(lesson)) {
                            rescued1++;
                            placedCount++;
                            unplacedLessons = unplacedLessons.filter(l => l !== lesson);
                        } else {
                            lesson.expectedRoomId = originalRoom;
                        }
                    }
                }
                if (rescued1 > 0) console.log(`救援策略1(放寬教室)：成功排入 ${rescued1} 筆`);
            }

            // ⭐ 記錄剩餘未排課程供連鎖解鎖按鈕使用
            //    (鎖定判斷已改由 locked 欄位負責，不再需要 preScheduledKeys 快照)
            window._chainRescueData = {
                unplacedLessons: unplacedLessons,
                swapCountFromAI: swapCount
            };

            // 如果有剩餘課程，顯示連鎖解鎖按鈕
            let rescueBtn = document.getElementById('btnChainRescue');
            if (rescueBtn) {
                rescueBtn.style.display = unplacedLessons.length > 0 ? 'block' : 'none';
            }

            // ⭐ 用快照判斷預排：按 AI 排課前就在課表裡的每筆課都是「手動預排」，
            //    AI 排完後全部標記為 locked。AI 新排的課保持 locked=""，可自由調整。
            //    同一格若有兩筆(如資源班+導師)，各自獨立判斷，互不影響。
            let preScheduledKeySet = new Set(
                preScheduledSnapshot.map(t => `${t.classId}|${t.day}|${t.period}|${t.subId}|${t.teaId}`)
            );
            virtualTimetable.forEach(t => {
                let key = `${t.classId}|${t.day}|${t.period}|${t.subId}|${t.teaId}`;
                t.locked = preScheduledKeySet.has(key) ? "true" : "";
            });

            globalScheduleData.timetable = virtualTimetable; 
            
            switchScheduleView(currentScheduleView); 
            renderSidebarTeachers();
            
            showStatus("statusTimetable", "雲端寫入中...", true); btn.innerText = "💾 儲存結果中...";
            
            google.script.run
            .withSuccessHandler(function(res) {
              if (res && res.error) {
                  alert("寫入資料庫失敗：" + res.error);
                  btn.disabled = false; btn.innerText = "✨ AI 接手安排剩餘節數"; showStatus("statusTimetable", "", false);
                  return;
              }
              btn.disabled = false; btn.innerText = "✨ AI 接手安排剩餘節數"; showStatus("statusTimetable", "", false);
              let unplaced = pendingLessons.length - placedCount;
              let fragIssues = validateFragmentationIssues(virtualTimetable);
              let fragMsg = formatFragmentationIssues(fragIssues);
              if (unplaced === 0) { 
                  alert(`🎉 深度排課大成功！所有課程皆已完美排入！\n\n(AI 為避開死局，共自動交換了 ${swapCount} 筆科任課程，但不影響您的原始配課表)${fragMsg}`); 
              } else { 
                  alert(`⚠️ 演算法已盡力尋找最佳解！\n\n成功排入 ${placedCount} 單位，剩餘 ${unplaced} 單位的卡關課程已退回左側清單。\n(AI 自動交換了 ${swapCount} 筆科任課程以爭取空間)${fragMsg}`); 
              }
            })
            .withFailureHandler(function(err) {
              alert("雲端通訊超時或錯誤，請檢查網路狀態：" + err);
              btn.disabled = false; btn.innerText = "✨ AI 接手安排剩餘節數"; showStatus("statusTimetable", "", false);
            })
            .batchSaveTimetable(JSON.stringify(virtualTimetable));
        }

        processPSOChunk(); 
      }, 100);
    }
    // ====================================================================
    // ⭐ 獨立連鎖解鎖函式：排課完成後，使用者手動觸發
    //    只會移動 AI 排的課，絕對不動預排（鎖定）的課程
    // ====================================================================
    function runChainRescue() {
        if (!window._chainRescueData || !window._chainRescueData.unplacedLessons || window._chainRescueData.unplacedLessons.length === 0) {
            return alert("目前沒有卡關課程需要連鎖解鎖！");
        }

        let rescueBtn = document.getElementById('btnChainRescue');
        rescueBtn.disabled = true; rescueBtn.innerText = "🔗 連鎖解鎖運算中...";
        showStatus("statusTimetable", "連鎖解鎖中...", true);

        setTimeout(() => {
            let unplacedLessons = [...window._chainRescueData.unplacedLessons];
            let timetable = globalScheduleData.timetable;

            const DAYS = ["星期一", "星期二", "星期三", "星期四", "星期五"];
            const validPeriods = SCHEDULE_FRAME.filter(f => f.type === 'class').map(f => f.id);
            const consecPairs = [['1','2'], ['2','3'], ['3','4'], ['5','6'], ['6','7']];

            // ⭐ 判斷一筆課表紀錄是否為鎖定(預排) — 直接讀 locked 欄位，跨 session 永久有效
            //    不管跑幾次連鎖解鎖，locked 的課永遠不會被移動
            let isLocked = (t) => isLockedRecord(t);

            // 判斷一堂課是否「不可觸碰」（鎖定、本土語、資源班/特教）
            let isUntouchable = (t) => {
                if (isLocked(t)) return true;
                let subName = t.subName || "";
                let role = globalScheduleData.teachers.find(tea=>tea.id===t.teaId)?.role || "";
                let isSpecial = subName.includes("資源") || subName.includes("特教") || role.includes("特教") || role.includes("教支");
                let isLocal = subName.includes("本土") || subName.includes("閩") || subName.includes("客");
                return isSpecial || isLocal;
            };

            // ⭐ 完整時段檢查：直接沿用主排課引擎的規則（黑白名單、負荷上限、時段限制全包）
            //    grade 會在 makeLessonObj / 傳入前補上，這裡確保 lesson.grade 存在
            let checkSlotOk = (lesson, day, period) => {
                if (!lesson.grade) {
                    let cls = globalScheduleData.classes.find(c=>c.id===lesson.classId);
                    lesson.grade = cls ? (cls.name.match(/\d+/) ? cls.name.match(/\d+/)[0] : "0") : "0";
                }
                return checkSlotFully(lesson, day, period, timetable);
            };

            // 防切割檢查
            let fragCheck = (lesson, day, period) => {
                if (lesson.isHomeroom || lesson.isLocal) return true;
                let sameDaySlots = timetable.filter(t => t.classId === lesson.classId && t.subId === lesson.subId && t.day === day);
                if (sameDaySlots.length >= 2) return false;
                if (sameDaySlots.length === 1) {
                    let existingP = sameDaySlots[0].period;
                    return consecPairs.some(pair => (pair[0] === existingP && pair[1] === period) || (pair[1] === existingP && pair[0] === period));
                }
                return true;
            };

            // 建立 lesson 物件的輔助函式
            let makeLessonObj = (t) => {
                let cls = globalScheduleData.classes.find(c=>c.id===t.classId);
                let grade = cls ? (cls.name.match(/\d+/) ? cls.name.match(/\d+/)[0] : "0") : "0";
                let role = globalScheduleData.teachers.find(tea=>tea.id===t.teaId)?.role || "";
                return {
                    classId: t.classId, subId: t.subId, teaId: t.teaId, subName: t.subName,
                    isCoTeach: t.isCoTeach, consec: false, expectedRoomId: t.roomId || "ROOM_HOME",
                    isHomeroom: t.teaId === globalScheduleData.classes.find(c=>c.id===t.classId)?.homeroomId && t.teaId !== "",
                    isSpecial: (t.subName||"").includes("資源") || (t.subName||"").includes("特教") || role.includes("特教") || role.includes("教支"),
                    isLocal: (t.subName||"").includes("本土") || (t.subName||"").includes("閩") || (t.subName||"").includes("客"),
                    grade: grade, role: role
                };
            };

            // 嘗試直接放入
            let tryDirectPlace = (lesson) => {
                for (let day of DAYS) {
                    for (let p of validPeriods) {
                        if (checkSlotOk(lesson, day, p) && fragCheck(lesson, day, p)) {
                            timetable.push({ classId: lesson.classId, day: day, period: p, subId: lesson.subId, teaId: lesson.teaId, subName: lesson.subName, isCoTeach: lesson.isCoTeach, roomId: lesson.expectedRoomId });
                            return true;
                        }
                    }
                }
                return false;
            };

            let rescued = 0;
            let moves = []; // 記錄所有移動，用於最後的報告

            for (let lesson of [...unplacedLessons]) {
                if (lesson.consec) continue; // 連堂先跳過

                let placed = false;

                // 第一輪：直接找空位（可能 AI 排課後手動調整釋放了空間）
                if (tryDirectPlace(lesson)) {
                    rescued++;
                    unplacedLessons = unplacedLessons.filter(l => l !== lesson);
                    moves.push({ type: '直接放入', lesson: lesson });
                    continue;
                }

                // 第二輪：騰位（只騰非鎖定的課）
                for (let day of DAYS) {
                    if (placed) break;
                    for (let p of validPeriods) {
                        if (placed) break;

                        let occupants = timetable.filter(t => t.day === day && t.period === p);
                        // ⭐ 3. 在尋找 Blocker 時套用 isUntouchable： 確保本土語和資源班不會被移走
                        let classBlocker = occupants.find(t => t.classId === lesson.classId && !isUntouchable(t));
                        let teacherBlocker = occupants.find(t => t.teaId === lesson.teaId && t.teaId !== "" && !isUntouchable(t));
                        let blocker = classBlocker || teacherBlocker;
                        if (!blocker || isUntouchable(blocker)) continue;

                        // 暫時移除 blocker
                        let bIdx = timetable.findIndex(t => t === blocker);
                        if (bIdx === -1) continue;
                        timetable.splice(bIdx, 1);

                        // 嘗試放入卡住的課
                        if (checkSlotOk(lesson, day, p) && fragCheck(lesson, day, p)) {
                            timetable.push({ classId: lesson.classId, day: day, period: p, subId: lesson.subId, teaId: lesson.teaId, subName: lesson.subName, isCoTeach: lesson.isCoTeach, roomId: lesson.expectedRoomId });

                            // 嘗試把 blocker 放到別處
                            let blockerLesson = makeLessonObj(blocker);
                            if (tryDirectPlace(blockerLesson)) {
                                rescued++;
                                placed = true;
                                unplacedLessons = unplacedLessons.filter(l => l !== lesson);
                                moves.push({ type: '騰位', lesson: lesson, moved: blocker });
                            } else {
                                // blocker 放不了 → 回滾
                                timetable.pop(); // 移除剛放入的卡住課
                                timetable.push(blocker); // 放回 blocker
                            }
                        } else {
                            timetable.push(blocker); // 放回 blocker
                        }
                    }
                }
                if (placed) continue;

                // 第三輪：連鎖騰位（A→B→C，只騰非鎖定的課）
                for (let day of DAYS) {
                    if (placed) break;
                    for (let p of validPeriods) {
                        if (placed) break;

                        let occupants = timetable.filter(t => t.day === day && t.period === p);
                        // ⭐ 3. 在尋找 Blocker 時套用 isUntouchable： 確保本土語和資源班不會被移走
                        let classBlocker = occupants.find(t => t.classId === lesson.classId && !isUntouchable(t));
                        let teacherBlocker = occupants.find(t => t.teaId === lesson.teaId && t.teaId !== "" && !isUntouchable(t));
                        let blockerB = classBlocker || teacherBlocker;
                        if (!blockerB || isUntouchable(blockerB)) continue;

                        let bIdx = timetable.findIndex(t => t === blockerB);
                        if (bIdx === -1) continue;
                        timetable.splice(bIdx, 1);

                        if (!(checkSlotOk(lesson, day, p) && fragCheck(lesson, day, p))) {
                            timetable.push(blockerB);
                            continue;
                        }

                        timetable.push({ classId: lesson.classId, day: day, period: p, subId: lesson.subId, teaId: lesson.teaId, subName: lesson.subName, isCoTeach: lesson.isCoTeach, roomId: lesson.expectedRoomId });

                        let bLesson = makeLessonObj(blockerB);
                        if (tryDirectPlace(bLesson)) {
                            rescued++; placed = true;
                            unplacedLessons = unplacedLessons.filter(l => l !== lesson);
                            moves.push({ type: '騰位', lesson: lesson, moved: blockerB });
                            continue;
                        }

                        // B 直接放不下 → 嘗試再騰一層 C
                        let bPlaced = false;
                        for (let day2 of DAYS) {
                            if (bPlaced) break;
                            for (let p2 of validPeriods) {
                                if (bPlaced) break;
                                let occ2 = timetable.filter(t => t.day === day2 && t.period === p2);
                                // ⭐ 3. 在尋找 Blocker 時套用 isUntouchable： 確保本土語和資源班不會被移走
                                let cb2 = occ2.find(t => t.classId === blockerB.classId && !isUntouchable(t));
                                let tb2 = occ2.find(t => t.teaId === blockerB.teaId && t.teaId !== "" && !isUntouchable(t));
                                let blockerC = cb2 || tb2;
                                if (!blockerC || isUntouchable(blockerC)) continue;

                                let cIdx = timetable.findIndex(t => t === blockerC);
                                if (cIdx === -1) continue;
                                timetable.splice(cIdx, 1);

                                if (checkSlotOk(bLesson, day2, p2) && fragCheck(bLesson, day2, p2)) {
                                    timetable.push({ classId: blockerB.classId, day: day2, period: p2, subId: blockerB.subId, teaId: blockerB.teaId, subName: blockerB.subName, isCoTeach: blockerB.isCoTeach, roomId: blockerB.roomId });

                                    let cLesson = makeLessonObj(blockerC);
                                    if (tryDirectPlace(cLesson)) {
                                        bPlaced = true;
                                        rescued++; placed = true;
                                        unplacedLessons = unplacedLessons.filter(l => l !== lesson);
                                        moves.push({ type: '連鎖騰位', lesson: lesson, movedB: blockerB, movedC: blockerC });
                                    } else {
                                        // C 放不了 → 回滾 B
                                        timetable.pop();
                                        timetable.push(blockerC);
                                    }
                                } else {
                                    timetable.push(blockerC);
                                }
                            }
                        }

                        if (!bPlaced) {
                            // 全部回滾
                            timetable.pop(); // 移除卡住課
                            timetable.push(blockerB);
                        }
                    }
                }
            }

            // 結果報告
            let reportLines = moves.map(m => {
                let cName = globalScheduleData.classes.find(c=>c.id===m.lesson.classId)?.name || m.lesson.classId;
                let sName = globalScheduleData.subjects[m.lesson.subId] || m.lesson.subId;
                if (m.type === '直接放入') return `✅ ${cName} ${sName} → 直接找到空位`;
                if (m.type === '騰位') {
                    let mName = globalScheduleData.classes.find(c=>c.id===m.moved.classId)?.name || m.moved.classId;
                    let mSub = globalScheduleData.subjects[m.moved.subId] || m.moved.subId;
                    return `🔄 ${cName} ${sName} → 騰開 ${mName} ${mSub}`;
                }
                if (m.type === '連鎖騰位') {
                    return `🔗 ${cName} ${sName} → 連鎖移動2筆課程`;
                }
                return '';
            }).join('\n');

            let remaining = unplacedLessons.length;

            // 存檔
            switchScheduleView(currentScheduleView);
            renderSidebarTeachers();
            showStatus("statusTimetable", "雲端寫入中...", true);

            google.script.run
            .withSuccessHandler(function(res) {
                showStatus("statusTimetable", "", false);
                rescueBtn.disabled = false; rescueBtn.innerText = "🔗 連鎖解鎖剩餘卡關課程";

                if (rescued > 0) {
                    let msg = `🔗 連鎖解鎖完成！成功排入 ${rescued} 筆課程。\n\n${reportLines}`;
                    if (remaining > 0) msg += `\n\n仍有 ${remaining} 筆無法排入（受限於硬性約束），需手動調整。`;
                    alert(msg);
                } else {
                    alert(`⚠️ 連鎖解鎖未能排入任何課程。\n\n剩餘 ${remaining} 筆課程受到硬性約束（教師黑名單/班級時段全滿），建議手動拖曳調整。`);
                }

                if (remaining === 0) rescueBtn.style.display = 'none';
                window._chainRescueData.unplacedLessons = unplacedLessons;
            })
            .withFailureHandler(function(err) {
                alert("雲端通訊錯誤：" + err);
                showStatus("statusTimetable", "", false);
                rescueBtn.disabled = false; rescueBtn.innerText = "🔗 連鎖解鎖剩餘卡關課程";
            })
            .batchSaveTimetable(JSON.stringify(timetable));
        }, 100);
    }

  </script>
