<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>調課申請系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',-apple-system,sans-serif;background:#eef1f5;color:#1a1a2e;min-height:100vh}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#1a365d 0%,#2563eb 100%)}
.login-card{background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.18);text-align:center}
.login-card h1{font-size:22px;font-weight:700;color:#1a365d;margin-bottom:4px}
.login-card .sub{font-size:13px;color:#64748b;margin-bottom:28px}
.login-card input{width:100%;padding:12px 16px;border:2px solid #e2e8f0;border-radius:10px;font-size:15px;outline:none;transition:border .2s;font-family:inherit}
.login-card input:focus{border-color:#3b82f6}
.login-card button{width:100%;padding:12px;background:#1a365d;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:14px;transition:background .2s;font-family:inherit}
.login-card button:hover{background:#2563eb}
.login-card button:disabled{background:#94a3b8;cursor:not-allowed}
.login-err{color:#dc2626;font-size:13px;margin-top:12px;min-height:20px}
.header{background:#1a365d;color:#fff;padding:16px 24px 12px;position:sticky;top:0;z-index:50}
.header-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.h-title{font-size:18px;font-weight:700}.h-sub{font-size:12px;color:rgba(255,255,255,.65);margin-top:2px}
.h-right{display:flex;align-items:center;gap:10px}
.user-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500}
.btn-out{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit}
.tabs{display:flex;gap:0;max-width:1000px;margin:16px auto 0;padding:0 12px}
.tab-btn{padding:10px 20px;background:#fff;border:1px solid #e2e8f0;border-bottom:none;border-radius:10px 10px 0 0;font-size:13px;font-weight:600;cursor:pointer;color:#64748b;font-family:inherit;transition:all .15s}
.tab-btn.active{background:#1a365d;color:#fff;border-color:#1a365d}
.main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 1px 6px rgba(0,0,0,.08);margin-bottom:16px}
.card h3{font-size:15px;font-weight:700;color:#1a365d;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.form-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.form-col{flex:1;min-width:280px}
label.field{display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px}
input[type=date],select,textarea{width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:border .2s}
input[type=date]:focus,select:focus,textarea:focus{border-color:#3b82f6}
textarea{resize:vertical;min-height:70px}
.day-slots{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.slot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:2px solid #e8ecf0;cursor:pointer;transition:all .15s;font-size:13px}
.slot:hover{border-color:#93c5fd;background:#f0f7ff}
.slot.selected{border-color:#2563eb;background:#dbeafe;box-shadow:0 0 0 2px rgba(37,99,235,.2)}
.slot.free{color:#94a3b8;border-style:dashed;cursor:default}
.slot.conflict{border-color:#fca5a5;background:#fef2f2}
.slot .s-period{font-weight:700;color:#1e3a5f;min-width:50px}
.slot .s-sub{font-weight:600}.slot .s-class{color:#64748b;margin-left:auto;font-size:12px}
.slot .s-free{color:#94a3b8;font-style:italic}
.chk-row{display:flex;align-items:center;gap:8px;margin:14px 0;font-size:14px}
.chk-row input[type=checkbox]{width:18px;height:18px;accent-color:#2563eb}
.warn-box{background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:12px 16px;margin:12px 0;font-size:13px;color:#92400e}
.warn-box b{color:#b45309}
.btn-submit{padding:12px 32px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s}
.btn-submit:hover{background:#1d4ed8}
.btn-submit:disabled{background:#94a3b8;cursor:not-allowed}
.record-table{width:100%;border-collapse:collapse;font-size:13px}
.record-table th{background:#f1f5f9;text-align:left;padding:10px 8px;font-weight:600;color:#475569;border-bottom:2px solid #e2e8f0}
.record-table td{padding:10px 8px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.st{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.st-wait{background:#fef3c7;color:#b45309}
.st-rev{background:#dbeafe;color:#1d4ed8}
.st-ok{background:#d1fae5;color:#047857}
.st-no{background:#fee2e2;color:#b91c1c}
.rev-card{background:#fff;border:2px solid #e8ecf0;border-radius:12px;padding:16px 20px;margin-bottom:12px}
.rev-card .rev-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rev-card .rev-title{font-weight:700;font-size:14px;color:#1e293b}
.rev-card .rev-detail{font-size:13px;color:#475569;line-height:1.8}
.rev-card .rev-detail b{color:#1e293b}
.rev-actions{display:flex;gap:8px;margin-top:12px}
.rev-actions button{padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;border:none;transition:all .15s}
.rev-actions .btn-approve{background:#059669;color:#fff}.rev-actions .btn-approve:hover{background:#047857}
.rev-actions .btn-reject{background:#fff;color:#dc2626;border:1px solid #fca5a5}.rev-actions .btn-reject:hover{background:#fef2f2}
.center-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;gap:12px;color:#64748b;font-size:16px}
.spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-msg{text-align:center;color:#94a3b8;padding:40px;font-size:14px}
@media(max-width:640px){.form-col{min-width:100%}.login-card{padding:28px 24px}.main{padding:12px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ★★★ 換成你的 GAS Web App 部署網址 ★★★ */
var API_URL = "https://script.google.com/macros/s/AKfycbzJL3e9ofFRMuvCOwHVnYEVhsiY8GNkhU3p7MvvEH14-a4AoxXxt0ZYAXxWiQGWnkpJ/exec";

var USER=null, EMAIL="", allTeachers=null, mySchedule=null, partnerSchedule=null;
var selA=null, selB=null; // 選中的課格 {day,period,subName,className,subId,classId,teaId}
var PERIODS=["1","2","3","4","5","6","7"];
var PERIOD_LABELS={"1":"第一節","2":"第二節","3":"第三節","4":"第四節","5":"第五節","6":"第六節","7":"第七節"};
var WEEKDAYS=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

renderLogin();

/* ---- API ---- */
function apiGet(p){var qs=Object.keys(p).map(function(k){return k+"="+encodeURIComponent(p[k])}).join("&");return fetch(API_URL+"?"+qs,{redirect:"follow"}).then(function(r){return r.text()}).then(function(t){return JSON.parse(t)})}
function apiPost(d){return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d),redirect:"follow"}).then(function(r){return r.text()}).then(function(t){return JSON.parse(t)})}

/* ---- Login ---- */
function renderLogin(){
  var h='<div class="login-wrap"><div class="login-card">';
  h+='<h1>📝 調課申請系統</h1><div class="sub">請輸入您的電子郵件登入</div>';
  h+='<input id="inpEmail" type="email" placeholder="example@school.edu.tw" autofocus onkeydown="if(event.key===\'Enter\')doLogin()">';
  h+='<button id="btnLogin" onclick="doLogin()">登入</button>';
  h+='<div class="login-err" id="loginErr"></div></div></div>';
  $('app').innerHTML=h;
  try{var sv=localStorage.getItem('swapSysEmail');if(sv)document.getElementById('inpEmail').value=sv}catch(e){}
}
function doLogin(){
  var email=document.getElementById('inpEmail').value.trim();
  if(!email){document.getElementById('loginErr').textContent='請輸入電子郵件';return;}
  var btn=document.getElementById('btnLogin');btn.disabled=true;btn.textContent='驗證中...';
  document.getElementById('loginErr').textContent='';
  apiGet({action:"verify",email:email}).then(function(r){
    btn.disabled=false;btn.textContent='登入';
    if(r.error){document.getElementById('loginErr').textContent=r.error;return;}
    USER=r; EMAIL=email.toLowerCase();
    try{localStorage.setItem('swapSysEmail',email)}catch(e){}
    loadInitialData();
  }).catch(function(e){btn.disabled=false;btn.textContent='登入';document.getElementById('loginErr').textContent='連線錯誤：'+e.message;});
}
function logout(){USER=null;allTeachers=null;mySchedule=null;partnerSchedule=null;selA=null;selB=null;renderLogin();}

/* ---- 初始載入 ---- */
function loadInitialData(){
  $('app').innerHTML=mkHeader()+'<div class="center-msg"><div class="spinner"></div><span>載入資料...</span></div>';
  Promise.all([
    apiGet({action:"schedule",tid:USER.teacher.id,mode:"personal",cid:""}),
    apiGet({action:"swapTeachers"})
  ]).then(function(results){
    mySchedule=results[0].timetable;
    allTeachers=results[1].teachers.filter(function(t){return t.id!==USER.teacher.id});
    showTab('apply');
  }).catch(function(e){
    $('app').innerHTML=mkHeader()+'<div class="center-msg" style="color:#dc2626">❌ '+e.message+'</div>';
  });
}

/* ---- Header & Tabs ---- */
function mkHeader(){
  var h='<div class="header"><div class="header-top"><div>';
  h+='<div class="h-title">📝 '+esc(USER.schoolInfo.name||'調課申請系統')+'</div>';
  h+='<div class="h-sub">'+esc(USER.schoolInfo.year)+' 學年度</div></div>';
  h+='<div class="h-right"><div class="user-badge">'+esc(USER.teacher.name)+'（'+esc(USER.teacher.role)+'）</div>';
  h+='<button class="btn-out" onclick="logout()">登出</button></div></div></div>';
  return h;
}
function mkTabs(active){
  var h='<div class="tabs">';
  h+='<button class="tab-btn'+(active==='apply'?' active':'')+'" onclick="showTab(\'apply\')">📝 調課申請</button>';
  h+='<button class="tab-btn'+(active==='history'?' active':'')+'" onclick="showTab(\'history\')">📋 申請紀錄</button>';
  if(USER.isSwapReviewer||USER.isSwapApprover)
    h+='<button class="tab-btn'+(active==='review'?' active':'')+'" onclick="showTab(\'review\')">✅ 審核管理</button>';
  h+='</div>';
  return h;
}
function showTab(t){
  if(t==='apply') renderApplyTab();
  else if(t==='history') renderHistoryTab();
  else if(t==='review') renderReviewTab();
}

/* ================================================================
   調課申請頁
   ================================================================ */
function renderApplyTab(){
  selA=null; selB=null; partnerSchedule=null;
  var h=mkHeader()+mkTabs('apply')+'<div class="main">';

  // ---- 我的課程 ----
  h+='<div class="card"><h3>📘 Step 1：選擇我要調的課</h3>';
  h+='<label class="field">選擇日期</label>';
  h+='<input type="date" id="dateA" onchange="onDateA(this.value)">';
  h+='<div id="slotsA"></div></div>';

  // ---- 代課老師 ----
  h+='<div class="card"><h3>📗 Step 2：選擇代課老師與時段</h3>';
  h+='<div class="form-row"><div class="form-col">';
  h+='<label class="field">選擇老師</label><select id="selTeacher" onchange="onSelectTeacher(this.value)">';
  h+='<option value="">— 請選擇 —</option>';
  if(allTeachers) allTeachers.forEach(function(t){
    var label=t.name+(t.className?' ('+t.className+')':'')+'　'+t.role;
    h+='<option value="'+t.id+'">'+esc(label)+'</option>';
  });
  h+='</select></div><div class="form-col">';
  h+='<label class="field">選擇日期</label>';
  h+='<input type="date" id="dateB" onchange="onDateB(this.value)" disabled>';
  h+='</div></div>';
  h+='<div id="slotsB"></div></div>';

  // ---- 詳細資訊 ----
  h+='<div class="card"><h3>📋 Step 3：填寫資訊並送出</h3>';
  h+='<div id="summary"></div>';
  h+='<label class="field" style="margin-top:12px">調課原因</label>';
  h+='<textarea id="reason" placeholder="請說明調課原因..."></textarea>';
  h+='<div class="chk-row"><input type="checkbox" id="chkNotified"><label for="chkNotified">已告知代課老師本人</label></div>';
  h+='<div id="warnings"></div>';
  h+='<div style="text-align:center;margin-top:16px"><button class="btn-submit" id="btnSubmit" onclick="doSubmit()" disabled>送出調課申請</button></div>';
  h+='</div></div>';

  $('app').innerHTML=h;
}

/* ---- Step 1: 選日期 → 顯示我的課表 ---- */
function onDateA(val){
  selA=null; updateSummary();
  if(!val){$('slotsA').innerHTML='';return;}
  var d=new Date(val); var wd=WEEKDAYS[d.getDay()];
  if(d.getDay()===0||d.getDay()===6){$('slotsA').innerHTML='<div class="warn-box">⚠ 請選擇平日（週一到週五）</div>';return;}
  var lessons=mySchedule.filter(function(t){return t.day===wd});
  renderSlots('slotsA', lessons, wd, 'A', val);
}

/* ---- Step 2: 選老師 → 載入課表 ---- */
function onSelectTeacher(tid){
  selB=null; partnerSchedule=null; updateSummary();
  $('slotsB').innerHTML='';
  document.getElementById('dateB').value='';
  if(!tid){document.getElementById('dateB').disabled=true;return;}
  document.getElementById('dateB').disabled=false;

  // 載入該老師的個人課表
  $('slotsB').innerHTML='<div style="padding:12px;color:#64748b;font-size:13px">載入課表中...</div>';
  apiGet({action:"schedule",tid:tid,mode:"personal",cid:""}).then(function(data){
    partnerSchedule=data.timetable;
    $('slotsB').innerHTML='<div style="padding:12px;color:#64748b;font-size:13px">👆 請選擇日期</div>';
  }).catch(function(e){
    $('slotsB').innerHTML='<div class="warn-box">❌ '+e.message+'</div>';
  });
}

function onDateB(val){
  selB=null; updateSummary();
  if(!val||!partnerSchedule){$('slotsB').innerHTML='';return;}
  var d=new Date(val); var wd=WEEKDAYS[d.getDay()];
  if(d.getDay()===0||d.getDay()===6){$('slotsB').innerHTML='<div class="warn-box">⚠ 請選擇平日</div>';return;}
  renderSlots('slotsB', partnerSchedule, wd, 'B', val);
}

/* ---- 渲染某天的節次列表 ---- */
function renderSlots(containerId, schedule, weekday, side, dateStr){
  var h='<div class="day-slots">';
  h+='<div style="font-size:12px;color:#64748b;margin-bottom:4px">'+esc(dateStr)+' ('+esc(weekday)+')</div>';

  PERIODS.forEach(function(p){
    var lessons = schedule.filter(function(t){return t.day===weekday&&t.period===p});
    if(lessons.length>0){
      lessons.forEach(function(l){
        var selected = (side==='A'&&selA&&selA.period===p&&selA.day===weekday) || (side==='B'&&selB&&selB.period===p&&selB.day===weekday);

        // 衝堂檢查：如果選了 A，檢查 B 在 A 的時段是否有課
        var conflict = false;
        if(side==='B' && selA){
          var otherSchedule = partnerSchedule||[];
          var selAwd = selA.day;
          conflict = otherSchedule.some(function(t){return t.day===selAwd&&t.period===selA.period});
        }

        h+='<div class="slot'+(selected?' selected':'')+(conflict?' conflict':'')+'" onclick="pickSlot(\''+side+'\',\''+weekday+'\',\''+p+'\',\''+dateStr+'\',this)">';
        h+='<span class="s-period">'+esc(PERIOD_LABELS[p]||p)+'</span>';
        h+='<span class="s-sub">'+esc(l.subName)+'</span>';
        h+='<span class="s-class">'+esc(l.className)+'</span>';
        if(conflict) h+='<span style="color:#dc2626;font-size:11px;margin-left:8px">⚠ 衝堂</span>';
        h+='</div>';
      });
    } else {
      if(side==='B'){
        // 空堂可選（代課老師該節有空）
        h+='<div class="slot" style="border-color:#d1fae5;background:#f0fdf4;cursor:pointer" onclick="pickSlot(\''+side+'\',\''+weekday+'\',\''+p+'\',\''+dateStr+'\',this)">';
        h+='<span class="s-period">'+esc(PERIOD_LABELS[p]||p)+'</span>';
        h+='<span class="s-free">✅ 空堂（可代課）</span></div>';
      } else {
        h+='<div class="slot free"><span class="s-period">'+esc(PERIOD_LABELS[p]||p)+'</span><span class="s-free">空堂</span></div>';
      }
    }
  });
  h+='</div>';
  $(containerId).innerHTML=h;
}

/* ---- 選中課格 ---- */
function pickSlot(side, weekday, period, dateStr, el){
  var schedule = side==='A' ? mySchedule : (partnerSchedule||[]);
  var lesson = schedule.find(function(t){return t.day===weekday&&t.period===period});

  var obj = {
    day:weekday, period:period, date:dateStr,
    subName: lesson?lesson.subName:'空堂',
    className: lesson?lesson.className:'',
    subId: lesson?lesson.subId:'',
    classId: lesson?lesson.classId:'',
    teaId: lesson?lesson.teaId:''
  };

  if(side==='A'){
    if(!lesson){return;} // 自己的空堂不能選
    selA=obj;
    renderSlots('slotsA', mySchedule, weekday, 'A', dateStr);
  } else {
    selB=obj;
    renderSlots('slotsB', partnerSchedule||[], weekday, 'B', dateStr);
  }
  updateSummary();
}

/* ---- 摘要與衝堂警告 ---- */
function updateSummary(){
  var sumEl=$('summary'), warnEl=$('warnings'), btnEl=$('btnSubmit');
  if(!sumEl) return;

  if(!selA&&!selB){ sumEl.innerHTML='<div style="color:#94a3b8;font-size:13px">請先選擇雙方的課程時段</div>'; if(btnEl)btnEl.disabled=true; if(warnEl)warnEl.innerHTML=''; return; }

  var h='<div style="display:flex;gap:16px;flex-wrap:wrap;margin:8px 0">';
  if(selA){
    h+='<div style="flex:1;min-width:200px;background:#eff6ff;padding:12px;border-radius:8px;border-left:4px solid #2563eb">';
    h+='<div style="font-size:12px;color:#64748b;margin-bottom:4px">我的課程</div>';
    h+='<div style="font-weight:700">'+esc(selA.date)+' '+esc(selA.day)+' '+esc(PERIOD_LABELS[selA.period])+'</div>';
    h+='<div style="font-size:13px;color:#475569">'+esc(selA.subName)+' — '+esc(selA.className)+'</div></div>';
  }
  if(selB){
    var tid = document.getElementById('selTeacher').value;
    var tName = ''; if(allTeachers) allTeachers.forEach(function(t){if(t.id===tid)tName=t.name});
    h+='<div style="flex:1;min-width:200px;background:#f0fdf4;padding:12px;border-radius:8px;border-left:4px solid #059669">';
    h+='<div style="font-size:12px;color:#64748b;margin-bottom:4px">代課老師：'+esc(tName)+'</div>';
    h+='<div style="font-weight:700">'+esc(selB.date)+' '+esc(selB.day)+' '+esc(PERIOD_LABELS[selB.period])+'</div>';
    h+='<div style="font-size:13px;color:#475569">'+esc(selB.subName||'空堂')+(selB.className?' — '+esc(selB.className):'')+'</div></div>';
  }
  h+='</div>';
  sumEl.innerHTML=h;

  // 衝堂檢查
  var warns=[];
  if(selA&&selB&&partnerSchedule){
    var tidB = document.getElementById('selTeacher').value;
    var tNameB=''; if(allTeachers) allTeachers.forEach(function(t){if(t.id===tidB)tNameB=t.name});

    // B 在 A 的時段有課？
    var bBusy = partnerSchedule.some(function(t){return t.day===selA.day&&t.period===selA.period});
    if(bBusy) warns.push(tNameB+' 在 '+selA.day+PERIOD_LABELS[selA.period]+' 已有課程，可能衝堂');

    // A 在 B 的時段有課（排除 A 自己被調走的那堂）？
    if(selB.subName!=='空堂'){
      var aBusy = mySchedule.some(function(t){
        return t.day===selB.day&&t.period===selB.period&&!(t.day===selA.day&&t.period===selA.period);
      });
      if(aBusy) warns.push(USER.teacher.name+' 在 '+selB.day+PERIOD_LABELS[selB.period]+' 已有其他課程，可能衝堂');
    }
  }
  if(warnEl){
    if(warns.length>0){
      warnEl.innerHTML='<div class="warn-box"><b>⚠ 衝堂警告</b><br>'+warns.map(esc).join('<br>')+'<br><span style="font-size:12px;color:#78716c">仍可送出申請，由教學組審核判斷</span></div>';
    } else { warnEl.innerHTML=''; }
  }

  if(btnEl) btnEl.disabled = !(selA&&selB);
}

/* ---- 送出申請 ---- */
function doSubmit(){
  if(!selA||!selB) return;
  var reason = document.getElementById('reason').value.trim();
  if(!reason){alert('請填寫調課原因');return;}
  var notified = document.getElementById('chkNotified').checked;
  if(!notified){alert('請確認已告知代課老師');return;}

  var tidB = document.getElementById('selTeacher').value;
  var btn = document.getElementById('btnSubmit'); btn.disabled=true; btn.textContent='送出中...';

  apiPost({
    action:"submitSwap",
    tidA:USER.teacher.id, dateA:selA.date, weekdayA:selA.day, periodA:selA.period, subNameA:selA.subName, classNameA:selA.className,
    tidB:tidB, dateB:selB.date, weekdayB:selB.day, periodB:selB.period, subNameB:selB.subName, classNameB:selB.className,
    reason:reason, notified:notified
  }).then(function(r){
    btn.disabled=false; btn.textContent='送出調課申請';
    if(r.error){alert('❌ '+r.error);return;}
    var msg='✅ 調課申請已送出！\n序號：'+r.seqNo;
    if(r.warnings&&r.warnings.length>0) msg+='\n\n⚠ 系統偵測到衝堂：\n'+r.warnings.join('\n');
    alert(msg);
    showTab('history');
  }).catch(function(e){
    btn.disabled=false; btn.textContent='送出調課申請';
    alert('❌ '+e.message);
  });
}

/* ================================================================
   申請紀錄頁
   ================================================================ */
function renderHistoryTab(){
  $('app').innerHTML=mkHeader()+mkTabs('history')+'<div class="main"><div class="center-msg"><div class="spinner"></div><span>載入紀錄...</span></div></div>';
  apiGet({action:"swapList",email:EMAIL}).then(function(r){
    if(r.error){$('app').innerHTML=mkHeader()+mkTabs('history')+'<div class="main"><div class="warn-box">'+esc(r.error)+'</div></div>';return;}
    var mine=r.records.filter(function(x){return x.tidA===USER.teacher.id});
    var h=mkHeader()+mkTabs('history')+'<div class="main"><div class="card"><h3>📋 我的調課申請</h3>';
    if(mine.length===0){ h+='<div class="empty-msg">目前沒有調課申請紀錄</div>'; }
    else {
      h+='<div style="overflow-x:auto"><table class="record-table"><tr><th>序號</th><th>申請時間</th><th>我的課</th><th>代課老師</th><th>原因</th><th>狀態</th></tr>';
      mine.forEach(function(r){
        h+='<tr><td style="font-size:11px;color:#94a3b8">'+esc(r.seqNo)+'</td>';
        h+='<td>'+esc(r.time)+'</td>';
        h+='<td>'+esc(r.dateA)+' '+esc(r.weekdayA)+' '+esc(PERIOD_LABELS[r.periodA]||r.periodA)+'<br><span style="font-size:12px;color:#64748b">'+esc(r.subA)+' '+esc(r.classA)+'</span></td>';
        h+='<td>'+esc(r.nameB)+'<br><span style="font-size:12px;color:#64748b">'+esc(r.dateB)+' '+esc(r.weekdayB)+' '+esc(PERIOD_LABELS[r.periodB]||r.periodB)+'</span></td>';
        h+='<td style="max-width:120px">'+esc(r.reason)+'</td>';
        h+='<td>'+statusBadge(r.status)+'</td></tr>';
      });
      h+='</table></div>';
    }
    h+='</div></div>';
    $('app').innerHTML=h;
  }).catch(function(e){
    $('app').innerHTML=mkHeader()+mkTabs('history')+'<div class="main"><div class="warn-box">❌ '+e.message+'</div></div>';
  });
}

/* ================================================================
   審核管理頁
   ================================================================ */
function renderReviewTab(){
  $('app').innerHTML=mkHeader()+mkTabs('review')+'<div class="main"><div class="center-msg"><div class="spinner"></div><span>載入待審核項目...</span></div></div>';
  apiGet({action:"swapList",email:EMAIL}).then(function(r){
    if(r.error){$('app').innerHTML=mkHeader()+mkTabs('review')+'<div class="main"><div class="warn-box">'+esc(r.error)+'</div></div>';return;}

    var pending=[];
    if(r.isReviewer) pending=pending.concat(r.records.filter(function(x){return x.status==="待審核"}));
    if(r.isApprover) pending=pending.concat(r.records.filter(function(x){return x.status==="組長核准"}));
    // 去重
    var seen={};pending=pending.filter(function(x){if(seen[x.seqNo])return false;seen[x.seqNo]=true;return true;});

    var h=mkHeader()+mkTabs('review')+'<div class="main">';

    if(r.isReviewer) h+='<div style="margin-bottom:8px;font-size:12px;color:#059669;font-weight:600">👤 教學組長身份</div>';
    if(r.isApprover) h+='<div style="margin-bottom:8px;font-size:12px;color:#2563eb;font-weight:600">👤 教務主任身份</div>';

    if(pending.length===0){ h+='<div class="card"><div class="empty-msg">目前沒有待審核的調課申請</div></div>'; }
    else {
      pending.forEach(function(rec){
        h+='<div class="rev-card"><div class="rev-head"><div class="rev-title">'+esc(rec.nameA)+' 的調課申請</div>'+statusBadge(rec.status)+'</div>';
        h+='<div class="rev-detail">';
        h+='<b>申請人：</b>'+esc(rec.nameA)+'<br>';
        h+='<b>調課課程：</b>'+esc(rec.dateA)+' '+esc(rec.weekdayA)+' '+esc(PERIOD_LABELS[rec.periodA]||rec.periodA)+' — '+esc(rec.subA)+' '+esc(rec.classA)+'<br>';
        h+='<b>代課老師：</b>'+esc(rec.nameB)+'<br>';
        h+='<b>代課時段：</b>'+esc(rec.dateB)+' '+esc(rec.weekdayB)+' '+esc(PERIOD_LABELS[rec.periodB]||rec.periodB)+' — '+(rec.subB?esc(rec.subB)+' '+esc(rec.classB):'空堂')+'<br>';
        h+='<b>原因：</b>'+esc(rec.reason)+'<br>';
        h+='<b>已告知對方：</b>'+esc(rec.notified);
        if(rec.revName) h+='<br><b>組長審核：</b>'+esc(rec.revName)+' ('+esc(rec.revTime)+')';
        h+='</div>';
        h+='<div class="rev-actions">';
        h+='<button class="btn-approve" onclick="doReview('+rec.row+',\'approve\')">✅ 核准</button>';
        h+='<button class="btn-reject" onclick="doReview('+rec.row+',\'reject\')">❌ 駁回</button>';
        h+='</div></div>';
      });
    }

    // 最近已處理
    var done=r.records.filter(function(x){return x.status==="已核准"||x.status==="已駁回"||x.status==="組長核准"});
    if(done.length>0){
      h+='<div class="card" style="margin-top:20px"><h3>📜 最近紀錄</h3>';
      h+='<div style="overflow-x:auto"><table class="record-table"><tr><th>申請人</th><th>調課</th><th>代課老師</th><th>狀態</th><th>審核</th></tr>';
      done.slice(0,20).forEach(function(rec){
        h+='<tr><td>'+esc(rec.nameA)+'</td>';
        h+='<td style="font-size:12px">'+esc(rec.dateA)+' '+esc(PERIOD_LABELS[rec.periodA]||rec.periodA)+'<br>'+esc(rec.subA)+'</td>';
        h+='<td>'+esc(rec.nameB)+'</td>';
        h+='<td>'+statusBadge(rec.status)+'</td>';
        h+='<td style="font-size:12px">'+esc(rec.revName||'')+(rec.appName?'<br>'+esc(rec.appName):'')+'</td></tr>';
      });
      h+='</table></div></div>';
    }

    h+='</div>';
    $('app').innerHTML=h;
  }).catch(function(e){
    $('app').innerHTML=mkHeader()+mkTabs('review')+'<div class="main"><div class="warn-box">❌ '+e.message+'</div></div>';
  });
}

function doReview(row, decision){
  var label = decision==='approve'?'核准':'駁回';
  if(!confirm('確定要「'+label+'」這筆調課申請嗎？')) return;
  apiPost({action:"reviewSwap",row:row,decision:decision,reviewerEmail:EMAIL}).then(function(r){
    if(r.error){alert('❌ '+r.error);return;}
    alert('✅ 已'+label+'！');
    renderReviewTab();
  }).catch(function(e){alert('❌ '+e.message);});
}

/* ---- Helpers ---- */
function $(id){return document.getElementById(id)}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function statusBadge(s){
  var cls='st-wait';
  if(s==='組長核准')cls='st-rev'; else if(s==='已核准')cls='st-ok'; else if(s==='已駁回')cls='st-no';
  return '<span class="st '+cls+'">'+esc(s)+'</span>';
}
</script>
</body>
</html>
