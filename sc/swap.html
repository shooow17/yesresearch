<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>調課申請系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',-apple-system,sans-serif;background:#eef1f5;color:#1a1a2e;min-height:100vh}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#1a365d 0%,#2563eb 100%)}
.login-card{background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:440px;box-shadow:0 8px 32px rgba(0,0,0,.18);text-align:center}
.login-card h1{font-size:26px;font-weight:700;color:#1a365d;margin-bottom:6px}
.login-card .sub{font-size:15px;color:#64748b;margin-bottom:28px}
.login-card input{width:100%;padding:14px 18px;border:2px solid #e2e8f0;border-radius:10px;font-size:17px;outline:none;transition:border .2s;font-family:inherit}
.login-card input:focus{border-color:#3b82f6}
.login-card button{width:100%;padding:14px;background:#1a365d;color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:600;cursor:pointer;margin-top:14px;transition:background .2s;font-family:inherit}
.login-card button:hover{background:#2563eb}
.login-card button:disabled{background:#94a3b8;cursor:not-allowed}
.login-err{color:#dc2626;font-size:15px;margin-top:12px;min-height:20px}
.header{background:#1a365d;color:#fff;padding:18px 24px 14px;position:sticky;top:0;z-index:50}
.header-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.h-title{font-size:20px;font-weight:700}.h-sub{font-size:13px;color:rgba(255,255,255,.65);margin-top:2px}
.h-right{display:flex;align-items:center;gap:10px}
.user-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:6px 16px;border-radius:20px;font-size:14px;font-weight:500}
.btn-out{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit}
.tabs{display:flex;gap:0;max-width:1100px;margin:16px auto 0;padding:0 12px;flex-wrap:wrap}
.tab-btn{padding:14px 28px;background:#fff;border:1px solid #e2e8f0;border-bottom:none;border-radius:10px 10px 0 0;font-size:16px;font-weight:600;cursor:pointer;color:#64748b;font-family:inherit;transition:all .15s;position:relative}
.tab-btn.active{background:#1a365d;color:#fff;border-color:#1a365d}
.tab-badge{position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:24px 28px;box-shadow:0 1px 6px rgba(0,0,0,.08);margin-bottom:16px}
.card h3{font-size:20px;font-weight:700;color:#1a365d;margin-bottom:16px;display:flex;align-items:center;gap:6px}
.form-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.form-col{flex:1;min-width:280px}
label.field{display:block;font-size:16px;font-weight:600;color:#475569;margin-bottom:6px}
input[type=date],select,textarea{width:100%;padding:14px 16px;border:2px solid #e2e8f0;border-radius:8px;font-size:17px;font-family:inherit;outline:none;transition:border .2s}
input[type=date]:focus,select:focus,textarea:focus{border-color:#3b82f6}
textarea{resize:vertical;min-height:80px}
.day-slots{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.slot{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:8px;border:2px solid #e8ecf0;cursor:pointer;transition:all .15s;font-size:17px}
.slot:hover{border-color:#93c5fd;background:#f0f7ff}
.slot.selected{border-color:#2563eb;background:#dbeafe;box-shadow:0 0 0 2px rgba(37,99,235,.2)}
.slot.free{color:#94a3b8;border-style:dashed;cursor:default}
.slot.conflict{border-color:#fca5a5;background:#fef2f2}
.slot .s-period{font-weight:700;color:#1e3a5f;min-width:60px;font-size:17px}
.slot .s-sub{font-weight:600;font-size:17px}.slot .s-class{color:#64748b;margin-left:auto;font-size:15px}
.slot .s-free{color:#94a3b8;font-style:italic;font-size:16px}
.chk-row{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:17px}
.chk-row input[type=checkbox]{width:22px;height:22px;accent-color:#2563eb}
.warn-box{background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:16px 20px;margin:12px 0;font-size:16px;color:#92400e}
.btn-submit{padding:16px 40px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-submit:hover{background:#1d4ed8}
.btn-submit:disabled{background:#94a3b8;cursor:not-allowed}
.record-table{width:100%;border-collapse:collapse;font-size:13px}
.record-table th{background:#f1f5f9;text-align:left;padding:14px 12px;font-weight:600;color:#475569;border-bottom:2px solid #e2e8f0;font-size:15px}
.record-table td{padding:14px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top;font-size:15px}
.st{display:inline-block;padding:5px 14px;border-radius:12px;font-size:15px;font-weight:600}
.st-p{background:#fef3c7;color:#b45309}
.st-r{background:#dbeafe;color:#1d4ed8}
.st-ok{background:#d1fae5;color:#047857}
.st-no{background:#fee2e2;color:#b91c1c}
/* 進度條 */
.flow{display:flex;align-items:center;gap:0;margin:14px 0 8px;font-size:14px}
.flow-step{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.flow-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;border:2px solid #cbd5e1;color:#94a3b8;background:#fff}
.flow-dot.done{background:#059669;border-color:#059669;color:#fff}
.flow-dot.active{background:#2563eb;border-color:#2563eb;color:#fff;animation:pulse 1.5s infinite}
.flow-dot.fail{background:#dc2626;border-color:#dc2626;color:#fff}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.3)}50%{box-shadow:0 0 0 6px rgba(37,99,235,0)}}
.flow-label{font-size:13px;color:#64748b;margin-top:3px;text-align:center;max-width:70px}
.flow-line{width:40px;height:2px;background:#e2e8f0;margin-bottom:22px}
.flow-line.done{background:#059669}
/* 審核卡 */
.rev-card{background:#fff;border:2px solid #e8ecf0;border-radius:12px;padding:16px 20px;margin-bottom:12px}
.rev-card .rev-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.rev-card .rev-title{font-weight:700;font-size:20px;color:#1e293b}
.rev-card .rev-detail{font-size:17px;color:#475569;line-height:2}
.rev-card .rev-detail b{color:#1e293b}
.rev-card .rev-role{font-size:11px;color:#fff;padding:2px 8px;border-radius:10px;font-weight:600}
.rev-card .rev-role.partner{background:#f59e0b}
.rev-card .rev-role.chief{background:#3b82f6}
.rev-card .rev-role.dean{background:#7c3aed}
.rev-actions{display:flex;gap:8px;margin-top:12px}
.rev-actions button{padding:12px 28px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;border:none;transition:all .15s}
.rev-actions .btn-approve{background:#059669;color:#fff}.rev-actions .btn-approve:hover{background:#047857}
.rev-actions .btn-reject{background:#fff;color:#dc2626;border:1px solid #fca5a5}.rev-actions .btn-reject:hover{background:#fef2f2}
.center-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;gap:12px;color:#64748b;font-size:16px}
.spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-msg{text-align:center;color:#94a3b8;padding:40px;font-size:14px}
.tp2-roles{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tp2-role{padding:6px 14px;border-radius:16px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;font-family:inherit}
.tp2-role.active{background:#1a365d;color:#fff;border-color:#1a365d}
.tp2-grid{display:flex;flex-wrap:wrap;gap:5px;max-height:200px;overflow-y:auto;padding:4px}
.tp2-item{padding:6px 12px;border-radius:8px;font-size:14px;cursor:pointer;border:1.5px solid #e2e8f0;background:#f8fafc;transition:all .12s;text-align:center;min-width:80px}
.tp2-item:hover{border-color:#3b82f6;background:#eff6ff}
.tp2-item.selected{background:#2563eb;color:#fff;border-color:#2563eb}
.tp2-item .tp2-cls{font-size:11px;color:#94a3b8}.tp2-item.selected .tp2-cls{color:rgba(255,255,255,.7)}
.tp2-sel-name{display:inline-block;background:#1a365d;color:#fff;padding:4px 14px;border-radius:16px;font-size:14px;font-weight:600;margin-left:8px}
@media(max-width:640px){.form-col{min-width:100%}.login-card{padding:28px 24px}.main{padding:12px}.flow-line{width:16px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ★★★ 換成你的 GAS Web App 部署網址 ★★★ */
var API_URL = "https://script.google.com/macros/s/AKfycbzJL3e9ofFRMuvCOwHVnYEVhsiY8GNkhU3p7MvvEH14-a4AoxXxt0ZYAXxWiQGWnkpJ/exec";

var USER=null,EMAIL="",allTeachers=null,mySchedule=null,partnerSchedule=null;
var selA=null,selB=null,cachedSwapData=null,swapList=[],swapPickerRole="導師",swapSelTid="";
var PERIODS=["1","2","3","4","5","6","7"];
var PL={"1":"第一節","2":"第二節","3":"第三節","4":"第四節","5":"第五節","6":"第六節","7":"第七節"};
var WD=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

renderLogin();

function apiGet(p){var qs=Object.keys(p).map(function(k){return k+"="+encodeURIComponent(p[k])}).join("&");return fetch(API_URL+"?"+qs,{redirect:"follow"}).then(function(r){return r.text()}).then(function(t){return JSON.parse(t)})}
function apiPost(d){return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d),redirect:"follow"}).then(function(r){return r.text()}).then(function(t){return JSON.parse(t)})}

/* ---- Login ---- */
function renderLogin(){
  var h='<div class="login-wrap"><div class="login-card"><h1>📝 調課申請系統</h1><div class="sub">請輸入您的電子郵件登入</div>';
  h+='<input id="inpEmail" type="email" placeholder="example@school.edu.tw" autofocus onkeydown="if(event.key===\'Enter\')doLogin()">';
  h+='<button id="btnLogin" onclick="doLogin()">登入</button><div class="login-err" id="loginErr"></div></div></div>';
  $('app').innerHTML=h;
  try{var sv=localStorage.getItem('swapSysEmail');if(sv)document.getElementById('inpEmail').value=sv}catch(e){}
}
function doLogin(){
  var email=document.getElementById('inpEmail').value.trim();if(!email){document.getElementById('loginErr').textContent='請輸入電子郵件';return;}
  var btn=document.getElementById('btnLogin');btn.disabled=true;btn.textContent='驗證中...';document.getElementById('loginErr').textContent='';
  apiGet({action:"swapInit",email:email}).then(function(r){
    btn.disabled=false;btn.textContent='登入';
    if(r.error){document.getElementById('loginErr').textContent=r.error;return;}
    if(r.verify&&r.verify.error){document.getElementById('loginErr').textContent=r.verify.error;return;}
    USER=r.verify;EMAIL=email.toLowerCase();
    mySchedule=r.schedule?r.schedule.timetable:[];
    allTeachers=r.teachers?r.teachers.teachers.filter(function(t){return t.id!==USER.teacher.id}):[];
    cachedSwapData=r.swapList||null;
    try{localStorage.setItem('swapSysEmail',email)}catch(e){}
    showTab('apply');updateBadge();
  }).catch(function(e){btn.disabled=false;btn.textContent='登入';document.getElementById('loginErr').textContent='連線錯誤：'+e.message;});
}
function logout(){USER=null;allTeachers=null;mySchedule=null;partnerSchedule=null;selA=null;selB=null;cachedSwapData=null;swapList=[];swapSelTid='';renderLogin();}

function updateBadge(){
  var badge=document.querySelector('.tab-badge');
  if(cachedSwapData){
    var pc=countPending(cachedSwapData);
    var tabs=document.querySelectorAll('.tab-btn');
    tabs.forEach(function(t){
      if(t.textContent.indexOf('待處理')!==-1){
        var existing=t.querySelector('.tab-badge');
        if(pc>0){
          if(existing){existing.textContent=pc;}
          else{var b=document.createElement('span');b.className='tab-badge';b.textContent=pc;t.appendChild(b);}
          t.style.color='#dc2626';t.style.fontWeight='900';
        } else if(existing){existing.remove();}
      }
    });
  }
}
function getSwapData(force){
  if(!force&&cachedSwapData)return Promise.resolve(cachedSwapData);
  return apiGet({action:"swapList",email:EMAIL}).then(function(r){cachedSwapData=r;return r;});
}
function invalidateCache(){cachedSwapData=null;}

/* ---- Header & Tabs ---- */
function mkHeader(){
  var h='<div class="header"><div class="header-top"><div><div class="h-title">📝 '+esc(USER.schoolInfo.name||'調課申請系統')+'</div>';
  h+='<div class="h-sub">'+esc(USER.schoolInfo.year)+' 學年度</div></div>';
  h+='<div class="h-right"><div class="user-badge">'+esc(USER.teacher.name)+'（'+esc(USER.teacher.role)+'）</div>';
  h+='<button class="btn-out" onclick="logout()">登出</button></div></div></div>';return h;
}
function mkTabs(active){
  var pc=0;if(cachedSwapData)pc=countPending(cachedSwapData);
  var h='<div class="tabs">';
  h+='<button class="tab-btn'+(active==='apply'?' active':'')+'" onclick="showTab(\'apply\')">📝 調課申請</button>';
  h+='<button class="tab-btn'+(active==='history'?' active':'')+'" onclick="showTab(\'history\')">📋 申請紀錄</button>';
  h+='<button class="tab-btn'+(active==='pending'?' active':'')+'" onclick="showTab(\'pending\')">🔔 待處理';
  if(pc>0) h+='<span class="tab-badge">'+pc+'</span>';
  h+='</button>';
  if(USER.isSwapReviewer||USER.isSwapApprover)
    h+='<button class="tab-btn'+(active==='overview'?' active':'')+'" onclick="showTab(\'overview\')">📊 全部紀錄</button>';
  h+='</div>';return h;
}
function showTab(t){if(t==='apply')renderApplyTab();else if(t==='history')renderHistoryTab();else if(t==='pending')renderPendingTab();else if(t==='overview')renderOverviewTab();}

/* ================================================================
   調課申請
   ================================================================ */
function renderApplyTab(){
  selA=null;selB=null;partnerSchedule=null;
  var h=mkHeader()+mkTabs('apply')+'<div class="main">';

  // 已加入的調課清單
  if(swapList.length>0){
    h+='<div class="card" style="border:2px solid #3b82f6"><h3>📋 本次調課清單（'+swapList.length+' 組）</h3>';
    swapList.forEach(function(s,i){
      h+='<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:#eff6ff;border-radius:8px;margin-bottom:6px">';
      h+='<span style="font-weight:700;color:#2563eb;font-size:16px">'+( i+1)+'</span>';
      h+='<div style="flex:1"><div style="font-weight:600;font-size:15px">'+fmtDate(s.selA.date)+' '+esc(PL[s.selA.period])+' '+esc(s.selA.subName)+' '+esc(s.selA.className)+'</div>';
      h+='<div style="font-size:14px;color:#059669">↔ '+esc(s.tNameB)+'老師 '+fmtDate(s.selB.date)+' '+esc(PL[s.selB.period])+' '+(s.selB.subName||'空堂')+'</div></div>';
      h+='<button onclick="removeSwapItem('+i+')" style="background:#fee2e2;border:none;color:#dc2626;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600">✕</button>';
      h+='</div>';
    });
    h+='<div style="text-align:center;margin-top:10px"><button onclick="scrollToStep1()" style="background:#eff6ff;border:1.5px solid #3b82f6;color:#2563eb;padding:8px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">＋ 再新增一組調課</button></div>';
    h+='</div>';
  }

  // Step 1
  h+='<div class="card" id="step1Card"><h3>📘 Step 1：選擇我要調的課</h3><label class="field">選擇日期</label>';
  h+='<input type="date" id="dateA" onchange="onDateA(this.value)"><div id="slotsA"></div></div>';

  // Step 2
  h+='<div class="card"><h3>📗 Step 2：選擇調課對象與時段</h3>';
  h+='<label class="field">選擇老師';
  if(swapSelTid){var _st=null;if(allTeachers)allTeachers.forEach(function(t){if(t.id===swapSelTid)_st=t});
    if(_st)h+='<span class="tp2-sel-name">'+esc(_st.name)+(_st.className?' ('+esc(_st.className)+')':'')+'</span>';}
  h+='</label>';
  // 角色分頁
  var _groups={};if(allTeachers)allTeachers.forEach(function(t){var r=t.role||'其他';if(!_groups[r])_groups[r]=[];_groups[r].push(t);});
  var _order=["導師","行政","科任","特教","教支","外籍"];for(var _r in _groups){if(_order.indexOf(_r)===-1)_order.push(_r);}
  h+='<div class="tp2-roles">';
  _order.forEach(function(r){if(!_groups[r])return;h+='<button class="tp2-role'+(swapPickerRole===r?' active':'')+'" onclick="swapPickerRole=\''+esc(r)+'\';renderApplyTab()">'+esc(r)+'('+_groups[r].length+')</button>';});
  h+='</div>';
  // 教師列表
  var _list=(_groups[swapPickerRole]||[]).slice().sort(function(a,b){
    var ca=a.className||'',cb=b.className||'';
    if(ca&&cb){var ga=parseInt(ca)||99,gb=parseInt(cb)||99;if(ga!==gb)return ga-gb;var na=parseInt(ca.replace(/.*年/,''))||0,nb=parseInt(cb.replace(/.*年/,''))||0;return na-nb;}
    if(ca&&!cb)return -1;if(!ca&&cb)return 1;return a.name.localeCompare(b.name,'zh-Hant');
  });
  h+='<div class="tp2-grid">';
  _list.forEach(function(t){var sel=swapSelTid===t.id;
    h+='<div class="tp2-item'+(sel?' selected':'')+'" onclick="pickSwapTeacher(\''+t.id+'\')">';
    h+=esc(t.name);if(t.className)h+='<br><span class="tp2-cls">'+esc(t.className)+'</span>';h+='</div>';
  });
  h+='</div>';
  // 日期選擇
  h+='<div style="margin-top:12px"><label class="field">選擇日期</label>';
  h+='<input type="date" id="dateB" onchange="onDateB(this.value)"'+(swapSelTid?'':' disabled')+'></div>';
  h+='<div id="slotsB"></div>';
  // hidden select for compatibility
  h+='<select id="selTeacher" style="display:none"><option value="'+esc(swapSelTid)+'"></option></select>';
  h+='</div>';

  // 加入清單按鈕
  h+='<div style="text-align:center;margin-bottom:16px"><div id="summary"></div>';
  h+='<div id="warnings"></div>';
  h+='<button class="btn-submit" id="btnAdd" onclick="addToSwapList()" disabled style="background:#059669">➕ 加入調課清單</button></div>';

  // Step 3（有清單才顯示）
  if(swapList.length>0){
    h+='<div class="card" style="border:2px solid #059669"><h3>📋 Step 3：填寫資訊並送出</h3>';
    h+='<label class="field">調課原因</label><textarea id="reason" placeholder="請說明調課原因..."></textarea>';
    h+='<div class="chk-row"><input type="checkbox" id="chkNotified"><label for="chkNotified">已告知調課對象本人</label></div>';
    h+='<div style="text-align:center;margin-top:16px"><button class="btn-submit" id="btnSubmit" onclick="doSubmit()">送出調課申請（共 '+swapList.length+' 組）</button></div></div>';
  }

  h+='</div>';
  $('app').innerHTML=h;
}
function removeSwapItem(i){swapList.splice(i,1);renderApplyTab();}
function scrollToStep1(){var el=document.getElementById('step1Card');if(el)el.scrollIntoView({behavior:'smooth'});}
function onDateA(v){selA=null;updateSummary();if(!v){$('slotsA').innerHTML='';return;}
  var d=new Date(v),wd=WD[d.getDay()];if(d.getDay()===0||d.getDay()===6){$('slotsA').innerHTML='<div class="warn-box">⚠ 請選擇平日</div>';return;}
  renderSlots('slotsA',mySchedule,wd,'A',v);}
function pickSwapTeacher(tid){
  swapSelTid=tid;
  selB=null;partnerSchedule=null;
  renderApplyTab();
  // 載入課表
  if(!tid)return;
  var slotsEl=document.getElementById('slotsB');
  if(slotsEl)slotsEl.innerHTML='<div style="padding:12px;color:#64748b;font-size:14px">載入課表中...</div>';
  apiGet({action:"schedule",tid:tid,mode:"personal",cid:""}).then(function(d){
    partnerSchedule=d.timetable;
    var slotsEl2=document.getElementById('slotsB');

function onSelTea(tid){pickSwapTeacher(tid);}
function onDateB(v){selB=null;updateSummary();if(!v||!partnerSchedule){$('slotsB').innerHTML='';return;}

function renderSlots(cid,schedule,weekday,side,dateStr){
  var h='<div class="day-slots"><div style="font-size:12px;color:#64748b;margin-bottom:4px">'+esc(dateStr)+' ('+esc(weekday)+')</div>';
  PERIODS.forEach(function(p){
    var ls=schedule.filter(function(t){return t.day===weekday&&t.period===p});
    if(ls.length>0){ls.forEach(function(l){
      var sel=(side==='A'&&selA&&selA.period===p&&selA.day===weekday)||(side==='B'&&selB&&selB.period===p&&selB.day===weekday);
      var conf=false;if(side==='B'&&selA&&partnerSchedule){conf=partnerSchedule.some(function(t){return t.day===selA.day&&t.period===selA.period});}
      h+='<div class="slot'+(sel?' selected':'')+(conf?' conflict':'')+'" onclick="pickSlot(\''+side+'\',\''+weekday+'\',\''+p+'\',\''+dateStr+'\')">';
      h+='<span class="s-period">'+esc(PL[p]||p)+'</span><span class="s-sub">'+esc(l.subName)+'</span><span class="s-class">'+esc(l.className)+'</span>';
      if(conf)h+='<span style="color:#dc2626;font-size:11px;margin-left:8px">⚠ 衝堂</span>';h+='</div>';});
    } else {
      if(side==='B'){
        // 判斷對方老師身份：導師的非授課時段=科任課，科任/行政的非授課時段=空堂
        var partnerTid=document.getElementById('selTeacher')?document.getElementById('selTeacher').value:'';
        var isPartnerHR=false;if(allTeachers&&partnerTid)allTeachers.forEach(function(t){if(t.id===partnerTid&&t.role.indexOf('導師')!==-1)isPartnerHR=true;});
        var freeLabel=isPartnerHR?'科任課時段':'✅ 空堂（可調課）';
        var freeStyle=isPartnerHR?'border-color:#e2e8f0;background:#f8fafc':'border-color:#d1fae5;background:#f0fdf4';
        h+='<div class="slot" style="'+freeStyle+'" onclick="pickSlot(\''+side+'\',\''+weekday+'\',\''+p+'\',\''+dateStr+'\')">';
        h+='<span class="s-period">'+esc(PL[p]||p)+'</span><span class="s-free">'+freeLabel+'</span></div>';}
      else{h+='<div class="slot free"><span class="s-period">'+esc(PL[p]||p)+'</span><span class="s-free">空堂</span></div>';}
    }
  });h+='</div>';$(cid).innerHTML=h;}

function pickSlot(side,weekday,period,dateStr){
  var schedule=side==='A'?mySchedule:(partnerSchedule||[]);
  var lesson=schedule.find(function(t){return t.day===weekday&&t.period===period});
  var obj={day:weekday,period:period,date:dateStr,subName:lesson?lesson.subName:'空堂',className:lesson?lesson.className:'',subId:lesson?lesson.subId:'',classId:lesson?lesson.classId:'',teaId:lesson?lesson.teaId:''};
  if(side==='A'){if(!lesson)return;selA=obj;renderSlots('slotsA',mySchedule,weekday,'A',dateStr);}
  else{selB=obj;renderSlots('slotsB',partnerSchedule||[],weekday,'B',dateStr);}
  updateSummary();}

function updateSummary(){
  var se=$('summary'),we=$('warnings'),be=$('btnAdd');if(!se)return;
  if(!selA&&!selB){se.innerHTML='<div style="color:#94a3b8;font-size:14px">請先選擇雙方的課程時段</div>';if(be)be.disabled=true;if(we)we.innerHTML='';return;}
  var h='<div style="display:flex;gap:16px;flex-wrap:wrap;margin:8px 0">';
  if(selA){h+='<div style="flex:1;min-width:200px;background:#eff6ff;padding:14px;border-radius:8px;border-left:4px solid #2563eb">';
    h+='<div style="font-size:13px;color:#64748b;margin-bottom:4px">我的課程</div><div style="font-weight:700;font-size:16px">'+esc(selA.date)+' '+esc(selA.day)+' '+esc(PL[selA.period])+'</div>';
    h+='<div style="font-size:15px;color:#475569">'+esc(selA.subName)+' — '+esc(selA.className)+'</div></div>';}
  if(selB){var tid=document.getElementById('selTeacher').value,tn='';if(allTeachers)allTeachers.forEach(function(t){if(t.id===tid)tn=t.name});
    h+='<div style="flex:1;min-width:200px;background:#f0fdf4;padding:14px;border-radius:8px;border-left:4px solid #059669">';
    h+='<div style="font-size:13px;color:#64748b;margin-bottom:4px">調課對象：'+esc(tn)+'</div><div style="font-weight:700;font-size:16px">'+esc(selB.date)+' '+esc(selB.day)+' '+esc(PL[selB.period])+'</div>';
    h+='<div style="font-size:15px;color:#475569">'+esc(selB.subName||'空堂')+(selB.className?' — '+esc(selB.className):'')+'</div></div>';}
  h+='</div>';se.innerHTML=h;
  var warns=[];
  if(selA&&selB&&partnerSchedule){var tid2=document.getElementById('selTeacher').value,tn2='';if(allTeachers)allTeachers.forEach(function(t){if(t.id===tid2)tn2=t.name});
    if(partnerSchedule.some(function(t){return t.day===selA.day&&t.period===selA.period}))warns.push(tn2+' 在 '+selA.day+PL[selA.period]+' 已有課程，可能衝堂');
    if(selB.subName!=='空堂'&&mySchedule.some(function(t){return t.day===selB.day&&t.period===selB.period&&!(t.day===selA.day&&t.period===selA.period)}))warns.push(USER.teacher.name+' 在 '+selB.day+PL[selB.period]+' 已有其他課程，可能衝堂');}
  if(we){we.innerHTML=warns.length>0?'<div class="warn-box"><b>⚠ 衝堂警告</b><br>'+warns.map(esc).join('<br>')+'<br><span style="font-size:13px;color:#78716c">仍可加入清單，由審核者判斷</span></div>':'';}
  if(be)be.disabled=!(selA&&selB);}

function addToSwapList(){
  if(!selA||!selB)return;
  var tid=swapSelTid;
  var tName='';if(allTeachers)allTeachers.forEach(function(t){if(t.id===tid)tName=t.name});
  swapList.push({selA:JSON.parse(JSON.stringify(selA)),selB:JSON.parse(JSON.stringify(selB)),tidB:tid,tNameB:tName});
  swapSelTid='';partnerSchedule=null;selA=null;selB=null;
  renderApplyTab();
}

function doSubmit(){
  if(swapList.length===0){alert('請先加入至少一組調課');return;}
  var reason=document.getElementById('reason').value.trim();
  if(!reason){alert('請填寫調課原因');return;}
  if(!document.getElementById('chkNotified').checked){alert('請確認已告知調課對象');return;}
  var btn=document.getElementById('btnSubmit');btn.disabled=true;btn.textContent='送出中...';
  var pairs=swapList.map(function(s){
    return{dateA:s.selA.date,weekdayA:s.selA.day,periodA:s.selA.period,subNameA:s.selA.subName,classNameA:s.selA.className,
      tidB:s.tidB,dateB:s.selB.date,weekdayB:s.selB.day,periodB:s.selB.period,subNameB:s.selB.subName,classNameB:s.selB.className};
  });
  apiPost({action:"submitSwapBatch",tidA:USER.teacher.id,pairs:pairs,reason:reason,notified:true
  }).then(function(r){btn.disabled=false;btn.textContent='送出調課申請（共 '+swapList.length+' 組）';
    if(r.error){alert('❌ '+r.error);return;}
    alert('✅ 調課申請已送出！\n序號：'+r.seqNo+'\n共 '+r.count+' 組調課\n\n下一步：等待調課對象登入確認');
    swapList=[];invalidateCache();showTab('history');
  }).catch(function(e){btn.disabled=false;btn.textContent='送出調課申請（共 '+swapList.length+' 組）';alert('❌ '+e.message);});}

function doReview(row,decision){
  var label=decision==='approve'?'核准/確認':'駁回';
  if(!confirm('確定要「'+label+'」這筆調課申請嗎？'))return;
  apiPost({action:"reviewSwap",row:row,decision:decision,reviewerEmail:EMAIL}).then(function(r){
    if(r.error){alert('❌ '+r.error);return;}
    alert('✅ 已'+label+'！\n新狀態：'+r.newStatus);invalidateCache();renderPendingTab();
  }).catch(function(e){alert('❌ '+e.message);});}

function doReviewBatch(seqNo,decision){
  var label=decision==='approve'?'核准/確認':'駁回';
  if(!confirm('確定要「'+label+'」序號 '+seqNo+' 的調課申請嗎？'))return;
  apiPost({action:"reviewSwapBatch",seqNo:seqNo,decision:decision,reviewerEmail:EMAIL}).then(function(r){
    if(r.error){alert('❌ '+r.error);return;}
    alert('✅ 已'+label+'！');invalidateCache();renderPendingTab();
  }).catch(function(e){alert('❌ '+e.message);});}

function toggleAllPending(checked){
  document.querySelectorAll('.pending-chk').forEach(function(c){c.checked=checked});
  updateBatchCount();
}
function updateBatchCount(){
  var n=document.querySelectorAll('.pending-chk:checked').length;
  var el=document.getElementById('batchCount');
  if(el)el.textContent=n>0?'已勾選 '+n+' 筆':'';
}
function batchApproveAll(){
  var checked=[];
  document.querySelectorAll('.pending-chk:checked').forEach(function(c){checked.push(c.value)});
  if(checked.length===0){alert('請先勾選要核准的項目');return;}
  if(!confirm('確定要批次核准 '+checked.length+' 筆調課申請嗎？'))return;

  var total=checked.length,done=0,fail=0;
  var promises=checked.map(function(seqNo){
    return apiPost({action:"reviewSwapBatch",seqNo:seqNo,decision:"approve",reviewerEmail:EMAIL}).then(function(r){
      if(r.error)fail++;else done++;
    }).catch(function(){fail++;});
  });
  Promise.all(promises).then(function(){
    alert('✅ 批次核准完成！\n成功 '+done+' 筆'+(fail>0?'，失敗 '+fail+' 筆':''));
    invalidateCache();renderPendingTab();
  });
}

/* ---- 計算待處理項目 ---- */
function getPendingItems(r){
  var items=[];
  r.records.forEach(function(rec){
    if(rec.status==='待對方確認'&&rec.tidB===r.myTid) items.push({rec:rec,role:'partner'});
    else if(rec.status==='待組長審核'&&r.isReviewer) items.push({rec:rec,role:'reviewer'});
    else if(rec.status==='待主任核定'&&r.isApprover) items.push({rec:rec,role:'approver'});
  });return items;}
function countPending(r){return getPendingItems(r).length;}

/* ---- 審核進度條 ---- */
function renderFlowBar(rec){
  var steps=[{label:'送出',key:'submit'},{label:'對方確認',key:'partner'},{label:'組長審核',key:'reviewer'},{label:'主任核定',key:'approver'}];
  var statusMap={'待對方確認':1,'待組長審核':2,'待主任核定':3,'已核准':4,'已駁回':-1};
  var level=statusMap[rec.status]||0;
  var h='<div class="flow">';
  steps.forEach(function(s,i){
    if(i>0){var lnDone=level>i||(level===4);h+='<div class="flow-line'+(lnDone?' done':'')+'"></div>';}
    var cls='';
    if(level===-1){cls=i===0?'done':'fail';}
    else if(i<level){cls='done';}
    else if(i===level){cls='active';}
    var icon=cls==='done'?'✓':(cls==='fail'?'✕':(i+1));
    h+='<div class="flow-step"><div class="flow-dot '+cls+'">'+icon+'</div><div class="flow-label">'+s.label+'</div></div>';
  });
  h+='</div>';return h;}

/* ---- Helpers ---- */
function $(id){return document.getElementById(id)}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fmtDate(s){
  if(!s)return'';var d=new Date(s);if(isNaN(d.getTime()))return s;
  var wd=['日','一','二','三','四','五','六'];
  return(d.getFullYear()-1911)+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+wd[d.getDay()]+'）';
}
function fmtTime(s){
  if(!s)return'';var d=new Date(s);
  if(isNaN(d.getTime())){var m=s.match(/(\d{4})\/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})/);if(!m)return s;d=new Date(m[1],m[2]-1,m[3],m[4],m[5]);}
  if(isNaN(d.getTime()))return s;
  var ampm=d.getHours()<12?'上午':'下午';var hr=d.getHours()%12||12;
  return(d.getFullYear()-1911)+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+ampm+hr+':'+('0'+d.getMinutes()).slice(-2);
}
function fmtPeriod(p){return PL[p]||('第'+p+'節');}
function statusBadge(s){var c='st-p';if(s==='待組長審核'||s==='待主任核定')c='st-r';else if(s==='已核准')c='st-ok';else if(s==='已駁回')c='st-no';
  return'<span class="st '+c+'">'+esc(s)+'</span>';}
</script>
